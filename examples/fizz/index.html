<!doctype html>
<!-- The fizz, as a hero on any page. By Chris Cooley (https://coded.design/). MIT.
     Serve site-dist/ after `npm run site` and open /examples/fizz/: dist/ and demos/fizz/ sit there. -->
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fizz · a Fizlet hero</title>
<style>
  body { margin: 0; background: #07060f; color: #f6f3ff; font: 16px/1.6 system-ui, sans-serif; overflow-x: clip; }
  .card { padding-top: 120px; width: min(100%, 720px); }
  .hero { display: grid; place-items: center; gap: 12px; padding: 40px 16px; }
  figure.ae-slot { position: relative; width: 100%; aspect-ratio: 16 / 10; margin: 0; overflow: hidden; background: #0b0918; }
  .ae-slot__placeholder { position: absolute; inset: 0; width: 100%; height: 100%; }
  a { color: #19f0ff; }
</style>
<main class="hero">
  <h1>Crack the can.</h1>
  <!-- The figure's parent is the box the spray may fly over: it reaches up above the card. -->
  <div class="card">
    <figure class="ae-slot" data-slot-target="fizz#hero" role="img" aria-label="A pixel soda can, side and top views, crunches, pops and fizzes">
      <!-- The poster: also the still frame for reduced motion. The site build writes the real one. -->
      <svg class="ae-slot__placeholder" viewBox="0 0 160 100" aria-hidden="true"><rect x="28" y="6" width="40" height="80" fill="#ff2e88"/></svg>
    </figure>
  </div>
  <p>Tap the can. By <a href="https://coded.design/">Chris Cooley</a>.</p>
</main>
<script type="module">
  import { slot } from "../../dist/slot.js";
  slot("fizz#hero", () => import("../../demos/fizz/scene.js").then((m) => m.mount));
</script>
</html>
