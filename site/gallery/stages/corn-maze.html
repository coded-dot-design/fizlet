<div class="cm" aria-hidden="true"><style>
/* Corn Maze (site/gallery/pieces/maze/corn-maze.ts): the diorama draws on the scene's canvas (the
   whole stage); over it, a transparent key takes the pointer (a tap picks a spot, a swipe a way to
   walk) and the keyboard's focus, Board UI stickers show the pumpkins and the light left (a bar that
   goes red near the end), a line of help sits under them and the end card comes up in the middle.
   The keys (mute, MAP) are the gallery's keys strip (site/gallery/pieces/keys.ts); the camera frames
   the field (before the walk, on MAP, at the end) or follows you between the stickers and the strip.
   Dark: dusk to a blue night. Light: a golden afternoon to dusk. */
.cm{position:absolute;inset:0;background:#10132a}
html[data-theme="light"] .cm{background:#eee8e0}
.cm-poster,.cm~[data-fizlet-slot]>canvas,.cm~[data-fizlet-slot]>.cm-play{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.cm-poster{object-fit:cover}
.cm~[data-fizlet-slot]>.cm-play{pointer-events:auto;border:0;margin:0;padding:0;background:transparent;box-shadow:none;transition:none;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;outline-offset:-4px}
.cm~[data-fizlet-slot] .cm-hud{position:absolute;inset:0;pointer-events:none;font:800 clamp(11px,1.6cqw,14px)/1.2 ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif;color:var(--ink)}
.cm-head{position:absolute;left:8px;top:8px;right:8px;display:grid;gap:6px}
.cm-top{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0}
.cm~[data-fizlet-slot] .cm-chip{display:inline-flex;align-items:center;gap:.45em;padding:.4em .7em;background:var(--surface);color:var(--ink);border:2px solid var(--rim);border-radius:8px;box-shadow:calc(3px * var(--bui-sx)) calc(3px * var(--bui-sy)) 0 var(--bui-shadow);white-space:nowrap}
.cm-chip span{font-variant-numeric:tabular-nums;margin-right:.35em}
.cm~[data-fizlet-slot] .cm-lvl{color:#1f2433;background:#ffd36b;rotate:-1.5deg}
.cm-hint{min-height:1.2em;padding:0 2px;margin:0;font-size:.92em;color:#f4efe4;text-shadow:0 1px 0 #10132a,0 0 4px #10132a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-theme="light"] .cm-hint{color:#1f2433;text-shadow:0 1px 0 #eee8e0,0 0 4px #eee8e0}
.cm-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0}
.cm~[data-fizlet-slot] .cm-card{position:absolute;left:50%;top:46%;translate:-50% -50%;rotate:-1.5deg;display:grid;justify-items:center;gap:.5em;width:min(84%,22em);padding:1em 1.2em 1.1em;background:var(--surface);color:var(--ink);border:2.5px solid var(--rim);border-radius:12px;box-shadow:calc(6px * var(--bui-sx)) calc(6px * var(--bui-sy)) 0 var(--bui-shadow);text-align:center;pointer-events:auto}
.cm~[data-fizlet-slot] .cm-card[hidden]{display:none}
.cm-card>b{font-size:1.9em}
.cm-card p{margin:0;color:var(--muted)}
.cm-card .cm-stats{color:var(--ink)}
.cm~[data-fizlet-slot] .cm-again{min-height:44px;padding:0 1.2em;font:inherit;background:var(--k-go);color:var(--rim)}
.bui 
.cm~[data-fizlet-slot] .gk[disabled]{opacity:.45}
.cm~[data-fizlet-slot] .gk b{font-weight:inherit}
@container stage (aspect-ratio<7/5){
.cm-head{right:56px}
.cm~[data-fizlet-slot] .cm-hud{font-size:clamp(11px,3.2cqw,14px)}
.cm-hint{white-space:normal}

}
[data-fizlet-slot]:focus-within .cm-play:focus-visible{outline:3px solid #ff8a6b}
.cm-bar{display:inline-block;width:4.5em;height:.7em;border:2px solid #1f2433;border-radius:4px;background:#1f2433;overflow:hidden}
.cm-bar>i{display:block;height:100%;width:100%;background:#ffd36b}
.cm~[data-fizlet-slot] .cm-low{background:#ffe1d6;color:#1f2433}
.cm~[data-fizlet-slot] .cm-low .cm-bar>i{background:#ff8a6b}
.cm-card>b{font-size:1.9em}
</style></div>
