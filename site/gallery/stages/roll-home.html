<div class="rh" aria-hidden="true"><style>
/* Roll Home (site/gallery/pieces/roll/roll-home.ts): the diorama draws on the scene's canvas (the whole
   stage); over it, a transparent key takes the pointer and the keyboard's focus, Board UI stickers
   show the turn and who is home, a line of help sits under them and the end card comes up in the
   middle. The keys (mute, the two pawns, roll) are the gallery's keys strip (site/gallery/pieces/keys.ts),
   and the camera frames the board between the stickers and the strip. Wide: the board from the
   front. Square or tall (a phone held upright): the board seen from its end, long way into the
   picture. Dark: a neon night. Light: a pastel afternoon. */
.rh{position:absolute;inset:0;background:#12152a}
html[data-theme="light"] .rh{background:#f1e9df}
.rh-poster,.rh~[data-fizlet-slot]>canvas,.rh~[data-fizlet-slot]>.rh-play{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.rh-poster{object-fit:cover}
.rh~[data-fizlet-slot]>.rh-play{pointer-events:auto;border:0;margin:0;padding:0;background:transparent;box-shadow:none;transition:none;cursor:grab;touch-action:pan-y;-webkit-tap-highlight-color:transparent;outline-offset:-4px}
.rh~[data-fizlet-slot]>.rh-play.rh-aim{cursor:crosshair}
.rh~[data-fizlet-slot]>.rh-play.rh-drag{cursor:grabbing}
.rh~[data-fizlet-slot] .rh-hud{position:absolute;inset:0;pointer-events:none;font:800 clamp(11px,1.6cqw,14px)/1.2 ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif;color:var(--ink)}
.rh-head{position:absolute;left:8px;top:8px;right:8px;display:grid;gap:6px}
.rh-top{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0}
.rh~[data-fizlet-slot] .rh-chip{display:inline-flex;align-items:center;gap:.45em;padding:.4em .7em;background:var(--surface);color:var(--ink);border:2px solid var(--rim);border-radius:8px;box-shadow:calc(3px * var(--bui-sx)) calc(3px * var(--bui-sy)) 0 var(--bui-shadow);white-space:nowrap}
.rh-chip span{font-variant-numeric:tabular-nums;margin-right:.35em}
.rh-dot{display:inline-block;width:.7em;height:.7em;border:2px solid var(--rim);border-radius:50%;background:#f0735a}
.rh-dot.rh-bot{background:#6f8fd8}
.rh~[data-fizlet-slot] .rh-turn{color:#1f2433;rotate:-1.5deg}
.rh~[data-fizlet-slot] .rh-you{background:#f08e6f}
.rh~[data-fizlet-slot] .rh-them{background:#9fb6ee}
.rh-hint{min-height:1.2em;padding:0 2px;margin:0;font-size:.92em;color:#f4efe4;text-shadow:0 1px 0 #12152a,0 0 4px #12152a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-theme="light"] .rh-hint{color:#1f2433;text-shadow:0 1px 0 #f1e9df,0 0 4px #f1e9df}
.rh-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0}
.rh~[data-fizlet-slot] .rh-card{position:absolute;left:50%;top:46%;translate:-50% -50%;rotate:-1.5deg;display:grid;justify-items:center;gap:.5em;width:min(88%,25em);padding:1em 1.2em 1.1em;background:var(--surface);color:var(--ink);border:2.5px solid var(--rim);border-radius:12px;box-shadow:calc(6px * var(--bui-sx)) calc(6px * var(--bui-sy)) 0 var(--bui-shadow);text-align:center;pointer-events:auto}
.rh~[data-fizlet-slot] .rh-card[hidden]{display:none}
.rh-card>b{font-size:1.9em}
.rh-card p{margin:0;color:var(--muted)}
.rh-card .rh-stats{color:var(--ink)}
.rh~[data-fizlet-slot] .rh-again{min-height:44px;padding:0 1.2em;font:inherit;background:var(--k-go);color:var(--rim)}
.bui .rh~[data-fizlet-slot] .gk.rh-go:not([disabled]){background:var(--k-go);color:var(--rim)}
.rh~[data-fizlet-slot] .gk[disabled]{opacity:.45}
.rh~[data-fizlet-slot] .gk b{font-weight:inherit}
@container stage (aspect-ratio<7/5){
.rh-head{right:56px}
.rh~[data-fizlet-slot] .rh-hud{font-size:clamp(11px,3.2cqw,14px)}
.rh-hint{white-space:normal}

}
[data-fizlet-slot]:focus-within .rh-play:focus-visible{outline:3px solid #f08e6f}
</style></div>
