<div class="pd" aria-hidden="true"><style>
/* Parade Day (site/gallery/pieces/parade/parade-day.ts): the diorama draws on the scene's canvas (the
   whole stage); over it, a transparent key takes the pointer and the keyboard's focus, Board UI
   stickers show the distance and the air left, a line of help sits under them, and the start and
   score card comes up in the middle. The keys (mute, lean left, lean right) are the gallery's keys
   strip (site/gallery/pieces/keys.ts); the camera frames the street between the stickers and the
   strip. Wide: the street seen from behind and to the left. Tall (a phone held upright): from
   higher up, more street ahead. Dark: an evening parade under the street lamps. Light: morning. */
.pd{position:absolute;inset:0;background:#141a2c}
html[data-theme="light"] .pd{background:#efe6da}
.pd-poster,.pd~[data-fizlet-slot]>canvas,.pd~[data-fizlet-slot]>.pd-play{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.pd-poster{object-fit:cover}
.pd~[data-fizlet-slot]>.pd-play{pointer-events:auto;border:0;margin:0;padding:0;background:transparent;box-shadow:none;transition:none;cursor:ew-resize;touch-action:pan-y;-webkit-tap-highlight-color:transparent;outline-offset:-4px}
.pd~[data-fizlet-slot] .pd-hud{position:absolute;inset:0;pointer-events:none;font:800 clamp(11px,1.6cqw,14px)/1.2 ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif;color:var(--ink)}
.pd-head{position:absolute;left:8px;top:8px;right:64px;display:grid;gap:6px}
.pd-top{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0}
.pd~[data-fizlet-slot] .pd-chip{display:inline-flex;align-items:center;gap:.4em;padding:.4em .7em;background:var(--surface);color:var(--ink);border:2px solid var(--rim);border-radius:8px;box-shadow:calc(3px * var(--bui-sx)) calc(3px * var(--bui-sy)) 0 var(--bui-shadow);white-space:nowrap}
.pd-chip span{font-variant-numeric:tabular-nums;min-width:2.4em;text-align:right}
.pd-air i{display:inline-block;width:.95em;height:1.05em;border:2px solid #1f2433;border-radius:50% 50% 46% 46%;background:#f2a541}
.pd-air i.pd-out{background:transparent;border-color:var(--muted);border-style:dashed}
.pd-hint{min-height:1.2em;padding:0 2px;margin:0;font-size:.92em;color:#f4efe4;text-shadow:0 1px 0 #141a2c,0 0 4px #141a2c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-theme="light"] .pd-hint{color:#1f2433;text-shadow:0 1px 0 #efe6da,0 0 4px #efe6da}
.pd-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0}
.pd~[data-fizlet-slot] .pd-card{position:absolute;left:50%;top:50%;translate:-50% -50%;rotate:-1.5deg;display:grid;justify-items:center;gap:.5em;width:min(84%,24em);padding:1em 1.2em 1.1em;background:var(--surface);color:var(--ink);border:2.5px solid var(--rim);border-radius:12px;box-shadow:calc(6px * var(--bui-sx)) calc(6px * var(--bui-sy)) 0 var(--bui-shadow);text-align:center;pointer-events:auto}
.pd~[data-fizlet-slot] .pd-card[hidden],.pd-card p[hidden]{display:none}
.pd-card>b{font-size:1.9em}
.pd-card p{margin:0;color:var(--muted)}
.pd-card .pd-stats{color:var(--ink)}
.pd-card .pd-stats:empty{display:none}
.pd~[data-fizlet-slot] .pd-card.pd-start{top:70%}
.pd~[data-fizlet-slot] .pd-go{min-height:44px;padding:0 1.2em;font:inherit;background:var(--k-go);color:var(--rim)}
@container stage (aspect-ratio<7/5){
.pd~[data-fizlet-slot] .pd-hud{font-size:clamp(11px,3.2cqw,14px)}
.pd-hint{white-space:normal}
.pd-head{right:84px}
.pd~[data-fizlet-slot] .pd-card{top:46%}
}
[data-fizlet-slot]:focus-within .pd-play:focus-visible{outline:3px solid #f2a541}
</style></div>
