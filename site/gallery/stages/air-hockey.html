<div class="br" aria-hidden="true"><style>
/* Air Hockey (site/gallery/pieces/air-hockey/air-hockey.ts), one of the bar-games series: the diorama
   draws on the scene's canvas (the whole stage); over it, a transparent key takes the pointer and the
   keyboard's focus, Board UI stickers show the play and the score, a line of help sits under them and
   the end card comes up in the middle. The keys (mute, view) are the gallery's keys strip
   (site/gallery/pieces/keys.ts).
   The series shares this sheet (site/gallery/pieces/bar/room.ts makes the parts it styles). */
.br{position:absolute;inset:0;background:#120f1f}
html[data-theme="light"] .br{background:#f1e9df}
.br-poster,.br~[data-fizlet-slot]>canvas,.br~[data-fizlet-slot]>.br-play{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.br-poster{object-fit:cover}
.br~[data-fizlet-slot]>.br-play{pointer-events:auto;border:0;margin:0;padding:0;background:transparent;box-shadow:none;transition:none;cursor:grab;touch-action:none;-webkit-tap-highlight-color:transparent;outline-offset:-4px}
.br~[data-fizlet-slot]>.br-play.br-drag{cursor:grabbing}
/* The key never lifts or drops (Board UI keys do on hover and press): the art under it holds still. */
.br~[data-fizlet-slot]>button.br-play.br-play{transform:none;translate:none}
.br~[data-fizlet-slot] .br-hud{position:absolute;inset:0;pointer-events:none;font:800 clamp(11px,1.6cqw,14px)/1.2 ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif;color:var(--ink)}
.br-head{position:absolute;left:8px;top:8px;right:8px;display:grid;gap:6px}
.br-top{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0}
.br~[data-fizlet-slot] .br-chip{display:inline-flex;align-items:center;gap:.45em;padding:.4em .7em;background:var(--surface);color:var(--ink);border:2px solid var(--rim);border-radius:8px;box-shadow:calc(3px * var(--bui-sx)) calc(3px * var(--bui-sy)) 0 var(--bui-shadow);white-space:nowrap}
.br-chip span{font-variant-numeric:tabular-nums;margin-right:.35em}
.br-chip span:last-child{margin-right:0}
.br-chip em{font-style:normal;color:var(--muted);font-size:.85em}
.br-dot{display:inline-block;width:.75em;height:.75em;border:2px solid var(--rim);border-radius:50%;background:#f07f68}
.br-dot.br-foe{background:#6f9fd8}
.br~[data-fizlet-slot] .br-turn{background:#f07f68;color:#1f2433;rotate:-1.5deg}
.br~[data-fizlet-slot] .br-turn.br-them{background:#6f9fd8}
.br-pips{letter-spacing:.12em;color:#f07f68}
.br-hint{min-height:1.2em;padding:0 2px;margin:0;font-size:.92em;color:#f4efe4;text-shadow:0 1px 0 #120f1f,0 0 4px #120f1f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-theme="light"] .br-hint{color:#1f2433;text-shadow:0 1px 0 #f1e9df,0 0 4px #f1e9df}
.br-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0}
.br~[data-fizlet-slot] .br-card{position:absolute;left:50%;top:46%;translate:-50% -50%;rotate:-1.5deg;display:grid;justify-items:center;gap:.5em;width:min(84%,20em);padding:1em 1.2em 1.1em;background:var(--surface);color:var(--ink);border:2.5px solid var(--rim);border-radius:12px;box-shadow:calc(6px * var(--bui-sx)) calc(6px * var(--bui-sy)) 0 var(--bui-shadow);text-align:center;pointer-events:auto}
.br~[data-fizlet-slot] .br-card[hidden]{display:none}
.br-card>b{font-size:1.9em}
.br-card p{margin:0;color:var(--muted)}
.br~[data-fizlet-slot] .br-again{min-height:44px;padding:0 1.2em;font:inherit;background:var(--k-go);color:var(--rim)}
@container stage (aspect-ratio<7/5){
.br-head{right:56px}
.br~[data-fizlet-slot] .br-hud{font-size:clamp(11px,3.2cqw,14px)}
.br-hint{white-space:normal}
.br-chip em{display:none}
}
[data-fizlet-slot]:focus-within .br-play:focus-visible{outline:3px solid #f07f68}
</style></div>
