<div class="fz" data-fz aria-hidden="true"><style>
/* FizzBuzz (site/gallery/pieces/fizzbuzz.ts): the room, the counter, the can and the bee draw on the
   scene's pixel canvas; FIZZ, BUZZ and 123 are small Board UI keys (keys.ts, 44 px or more) in a strip on
   the stage's bottom edge, over the desk. The art is a late-night desk in both themes. */
.fz{position:absolute;inset:0;background:#110d22;box-shadow:inset 0 -56px #3f296a}
/* The art's 16:9 box (the poster and the live canvas): the whole of a wide stage; on a short wide
   one (a phone pinned wide), smaller and centred over the keys' 56 px strip; on a square or tall
   one, as wide as fits, centred, on the strip. */
.fz-poster,.fz~[data-fizlet-slot]>canvas{position:absolute;left:0;top:0;width:100%;height:56.25cqw;pointer-events:none;image-rendering:pixelated}
@container stage (aspect-ratio<7/5){.fz-poster,.fz~[data-fizlet-slot]>canvas{--w:min(100cqw,(100cqh - 106px)*16/9);width:var(--w);height:calc(var(--w)*9/16);left:calc(50cqw - var(--w)/2);top:calc(100cqh - 56px - var(--w)*9/16)}}
@container stage (aspect-ratio>=7/5) and (max-height:330px){.fz-poster,.fz~[data-fizlet-slot]>canvas{top:0;height:calc(100cqh - 56px);width:calc((100cqh - 56px) * 16 / 9);left:calc(50cqw - (100cqh - 56px) * 8 / 9)}}
[data-fizlet-slot]:focus-visible{outline:3px solid #19f0ff;outline-offset:-3px}
</style></div>
