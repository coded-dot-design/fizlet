<div class="sp" aria-hidden="true"><style>
/* Splash Pool (site/gallery/pieces/pool/splash-pool.ts): the diorama draws on the scene's canvas (the
   whole stage); over it, a transparent key takes the pointer and the keyboard's focus, Board UI
   stickers show the goal and the drops, a line of help sits under them and a toast comes up for a
   home run, a foul or the drain. The keys (mute, what you drop, drain) are the gallery's keys strip
   (site/gallery/pieces/keys.ts), and the camera frames the yard between the stickers and the strip.
   Dark: a night swim, the pool lit from below. Light: a pastel afternoon. */
.sp{position:absolute;inset:0;background:#121626}
html[data-theme="light"] .sp{background:#f1e9df}
.sp-poster,.sp~[data-fizlet-slot]>canvas,.sp~[data-fizlet-slot]>.sp-play{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.sp-poster{object-fit:cover}
.sp~[data-fizlet-slot]>.sp-play{pointer-events:auto;border:0;margin:0;padding:0;background:transparent;box-shadow:none;transition:none;cursor:crosshair;touch-action:pan-y;-webkit-tap-highlight-color:transparent;outline-offset:-4px}
.sp~[data-fizlet-slot]>.sp-play.sp-drag{cursor:grabbing}
.sp~[data-fizlet-slot] .sp-hud{position:absolute;inset:0;pointer-events:none;font:800 clamp(11px,1.6cqw,14px)/1.2 ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif;color:var(--ink)}
.sp-head{position:absolute;left:8px;top:8px;right:8px;display:grid;gap:6px}
.sp-top{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0}
.sp~[data-fizlet-slot] .sp-chip{display:inline-flex;align-items:center;gap:.45em;padding:.4em .7em;background:var(--surface);color:var(--ink);border:2px solid var(--rim);border-radius:8px;box-shadow:calc(3px * var(--bui-sx)) calc(3px * var(--bui-sy)) 0 var(--bui-shadow);white-space:nowrap}
.sp-chip span{font-variant-numeric:tabular-nums}
.sp~[data-fizlet-slot] .sp-goal{background:#f2c96b;color:#1f2433;rotate:-1.5deg}
html:not([data-theme="light"]) .sp~[data-fizlet-slot] .sp-goal{background:#b8ff5c}
.sp-hint{min-height:1.2em;padding:0 2px;margin:0;font-size:.92em;color:#f4efe4;text-shadow:0 1px 0 #121626,0 0 4px #121626;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-theme="light"] .sp-hint{color:#1f2433;text-shadow:0 1px 0 #f1e9df,0 0 4px #f1e9df}
.sp~[data-fizlet-slot] .sp-toast{position:absolute;left:50%;bottom:64px;translate:-50% 0;rotate:-2deg;padding:.5em .9em;font-size:1.25em;background:#7fcfb8;color:#1f2433}
html:not([data-theme="light"]) .sp~[data-fizlet-slot] .sp-toast{background:#4fe6ff}
.sp~[data-fizlet-slot] .sp-toast[hidden]{display:none}
.sp-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0}
.sp~[data-fizlet-slot] .gk[disabled]{opacity:.45}
.bui .sp~[data-fizlet-slot] .gk.sp-drain:not([disabled]){background:var(--k-go);color:var(--rim)}
@container stage (aspect-ratio<7/5){
.sp-head{right:56px}
.sp~[data-fizlet-slot] .sp-hud{font-size:clamp(11px,3.2cqw,14px)}
.sp-hint{white-space:normal}
}
[data-fizlet-slot]:focus-within .sp-play:focus-visible{outline:3px solid #4fe6ff}
</style></div>
