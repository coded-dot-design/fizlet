<div class="ph" aria-hidden="true"><style>
/* Pocket Harbour (site/gallery/pieces/harbour/pocket-harbour.ts): the town on its table draws on the
   scene's canvas (the whole stage); over it a transparent key takes the pointer (tap pokes, drag
   turns the table) and the keyboard's focus. Board UI stickers: the cat count and a line of help on
   top, a call in the middle when you find it, the end card. The keys (mute, day or night) are the
   gallery's keys strip (site/gallery/pieces/keys.ts), and the camera frames the table between the
   stickers and the strip. Light: an afternoon. Dark: the harbour at night under the lighthouse; the DAY / NIGHT key flips the
   scene (and the help line's colours, by .ph-night on the HUD) whatever the site's theme. */
.ph{position:absolute;inset:0;background:#121a2e}
html[data-theme="light"] .ph{background:#efe6da}
.ph-poster,.ph~[data-fizlet-slot]>canvas,.ph~[data-fizlet-slot]>.ph-play{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.ph-poster{object-fit:cover}
.ph~[data-fizlet-slot]>.ph-play{pointer-events:auto;border:0;margin:0;padding:0;background:transparent;box-shadow:none;transition:none;cursor:pointer;touch-action:pan-y;-webkit-tap-highlight-color:transparent;outline-offset:-4px}
.ph~[data-fizlet-slot]>.ph-play.ph-drag{cursor:grabbing}
.ph~[data-fizlet-slot] .ph-hud{position:absolute;inset:0;pointer-events:none;font:800 clamp(11px,1.6cqw,14px)/1.2 ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif;color:var(--ink)}
.ph-head{position:absolute;left:8px;top:8px;right:8px;display:grid;gap:6px}
.ph-top{display:flex;gap:8px;margin:0}
.ph~[data-fizlet-slot] .ph-chip{display:inline-flex;align-items:center;gap:.45em;padding:.4em .7em;background:var(--surface);color:var(--ink);border:2px solid var(--rim);border-radius:8px;box-shadow:calc(3px * var(--bui-sx)) calc(3px * var(--bui-sy)) 0 var(--bui-shadow);white-space:nowrap;rotate:-1.5deg;font-variant-numeric:tabular-nums}
.ph-paw{display:inline-block;width:.8em;height:.8em;border:2px solid var(--rim);border-radius:50% 50% 45% 45%;background:#e8894a}
.ph-hint{margin:0;padding:0 2px;font-size:.92em;color:#1f2433;text-shadow:0 1px 0 #efe6da,0 0 4px #efe6da}
.ph-night .ph-hint{color:#f4efe4;text-shadow:0 1px 0 #121a2e,0 0 4px #121a2e}
.ph~[data-fizlet-slot] .ph-toast{position:absolute;left:50%;top:32%;translate:-50% 0;rotate:-2deg;margin:0;padding:.45em .9em;background:#ffd166;color:#1f2433;border:2px solid var(--rim);border-radius:8px;box-shadow:calc(4px * var(--bui-sx)) calc(4px * var(--bui-sy)) 0 var(--bui-shadow);font-size:1.15em;white-space:nowrap}
.ph~[data-fizlet-slot] .ph-toast.ph-miss{background:var(--surface);color:var(--muted);font-size:.95em;rotate:1.5deg}
.ph~[data-fizlet-slot] .ph-toast[hidden],.ph~[data-fizlet-slot] .ph-card[hidden]{display:none}
.ph-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0}
.ph~[data-fizlet-slot] .ph-card{position:absolute;left:50%;top:44%;translate:-50% -50%;rotate:-1.5deg;display:grid;justify-items:center;gap:.5em;width:min(84%,22em);padding:1em 1.2em 1.1em;background:var(--surface);color:var(--ink);border:2.5px solid var(--rim);border-radius:12px;box-shadow:calc(6px * var(--bui-sx)) calc(6px * var(--bui-sy)) 0 var(--bui-shadow);text-align:center;pointer-events:auto}
.ph-card>b{font-size:1.9em}
.ph-card p{margin:0;color:var(--muted)}
.ph~[data-fizlet-slot] .ph-again{min-height:44px;padding:0 1.2em;font:inherit;background:var(--k-go);color:var(--rim)}
@container stage (aspect-ratio<7/5){
.ph-head{right:56px}
.ph~[data-fizlet-slot] .ph-hud{font-size:clamp(11px,3.2cqw,14px)}
}
[data-fizlet-slot]:focus-within .ph-play:focus-visible{outline:3px solid #ffd166}
</style></div>
