<div class="tt" aria-hidden="true"><style>
/* Table for Twelve (site/gallery/pieces/table/table-for-twelve.ts): the diorama draws on the scene's
   canvas (the whole stage); over it, a transparent key takes the pointer and the keyboard's focus,
   Board UI stickers show the score, the course and the dishes served hot, a line of help sits under
   them, and the start and end card comes up in the middle. The keys (mute, next dish, pass) are the
   gallery's keys strip (site/gallery/pieces/keys.ts); the camera frames the table between the
   stickers and the strip. Wide: the long table from the front, a little above. Tall (a phone held
   upright): the table end on, from above. Dark: the room by candlelight. Light: the room by day. */
.tt{position:absolute;inset:0;background:#14182b}
html[data-theme="light"] .tt{background:#e9dccb}
.tt-poster,.tt~[data-fizlet-slot]>canvas,.tt~[data-fizlet-slot]>.tt-play{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.tt-poster{object-fit:cover}
.tt~[data-fizlet-slot]>.tt-play{pointer-events:auto;border:0;margin:0;padding:0;background:transparent;box-shadow:none;transition:none;cursor:grab;touch-action:none;-webkit-tap-highlight-color:transparent;outline-offset:-4px}
.tt~[data-fizlet-slot] .tt-hud{position:absolute;inset:0;pointer-events:none;font:800 clamp(11px,1.6cqw,14px)/1.2 ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif;color:var(--ink)}
.tt-head{position:absolute;left:8px;top:8px;right:64px;display:grid;gap:6px}
.tt-top{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0}
.tt~[data-fizlet-slot] .tt-chip{display:inline-flex;align-items:center;gap:.4em;padding:.4em .7em;background:var(--surface);color:var(--ink);border:2px solid var(--rim);border-radius:8px;box-shadow:calc(3px * var(--bui-sx)) calc(3px * var(--bui-sy)) 0 var(--bui-shadow);white-space:nowrap}
.tt-chip span{font-variant-numeric:tabular-nums;min-width:1.4em;text-align:right}
.tt-n span{min-width:2.4em}
.tt-hint{min-height:1.2em;padding:0 2px;margin:0;font-size:.92em;color:#f4efe4;text-shadow:0 1px 0 #14182b,0 0 4px #14182b;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-theme="light"] .tt-hint{color:#1f2433;text-shadow:0 1px 0 #e9dccb,0 0 4px #e9dccb}
.tt-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0}
.tt~[data-fizlet-slot] .tt-card{position:absolute;left:50%;top:50%;translate:-50% -50%;rotate:-1.5deg;display:grid;justify-items:center;gap:.5em;width:min(84%,24em);padding:1em 1.2em 1.1em;background:var(--surface);color:var(--ink);border:2.5px solid var(--rim);border-radius:12px;box-shadow:calc(6px * var(--bui-sx)) calc(6px * var(--bui-sy)) 0 var(--bui-shadow);text-align:center;pointer-events:auto}
.tt~[data-fizlet-slot] .tt-card[hidden],.tt-card p[hidden]{display:none}
.tt-card>b{font-size:1.9em}
.tt-card p{margin:0;color:var(--muted)}
.tt-card .tt-stats{color:var(--ink)}
.tt-card .tt-stats:empty{display:none}
.tt~[data-fizlet-slot] .tt-card.tt-start{top:66%}
.tt~[data-fizlet-slot] .tt-go{min-height:44px;padding:0 1.2em;font:inherit;background:var(--k-go);color:var(--rim)}
.tt~[data-fizlet-slot] .gk.tt-pass{background:var(--k-go);color:var(--rim);min-width:88px}
@container stage (aspect-ratio<7/5){
.tt~[data-fizlet-slot] .tt-hud{font-size:clamp(11px,3.2cqw,14px)}
.tt-hint{white-space:normal}
.tt-head{right:56px}
.tt~[data-fizlet-slot] .tt-card{top:46%}
}
[data-fizlet-slot]:focus-within .tt-play:focus-visible{outline:3px solid #f2a541}
