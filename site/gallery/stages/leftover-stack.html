<div class="ls" aria-hidden="true"><style>
/* Leftover Stack (site/gallery/pieces/fridge/leftover-stack.ts): the diorama draws on the scene's
   canvas (the whole stage); over it, a transparent key takes the pointer and the keyboard's focus,
   Board UI stickers show the score, the dish count and the door's three bumps, a line of help sits
   under them, and the start and score card comes up in the middle. The keys (mute, turn, drop) are
   the gallery's keys strip (site/gallery/pieces/keys.ts); the camera frames the kitchen between the
   stickers and the strip. Wide: the fridge, its open door and the counter, from the left and a
   little above. Tall (a phone held upright): the fridge and its door, closer. Dark: the kitchen
   with the lights off, the fridge's light on. Light: the kitchen lights on. */
.ls{position:absolute;inset:0;background:#121628}
html[data-theme="light"] .ls{background:#e9dfd3}
.ls-poster,.ls~[data-fizlet-slot]>canvas,.ls~[data-fizlet-slot]>.ls-play{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.ls-poster{object-fit:cover}
.ls~[data-fizlet-slot]>.ls-play{pointer-events:auto;border:0;margin:0;padding:0;background:transparent;box-shadow:none;transition:none;cursor:grab;touch-action:none;-webkit-tap-highlight-color:transparent;outline-offset:-4px}
.ls~[data-fizlet-slot] .ls-hud{position:absolute;inset:0;pointer-events:none;font:800 clamp(11px,1.6cqw,14px)/1.2 ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif;color:var(--ink)}
.ls-head{position:absolute;left:8px;top:8px;right:64px;display:grid;gap:6px}
.ls-top{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0}
.ls~[data-fizlet-slot] .ls-chip{display:inline-flex;align-items:center;gap:.4em;padding:.4em .7em;background:var(--surface);color:var(--ink);border:2px solid var(--rim);border-radius:8px;box-shadow:calc(3px * var(--bui-sx)) calc(3px * var(--bui-sy)) 0 var(--bui-shadow);white-space:nowrap}
.ls-chip span{font-variant-numeric:tabular-nums;min-width:1.4em;text-align:right}
.ls-n span{min-width:3.2em}
.ls-door i{display:inline-block;width:.8em;height:1.05em;border:2px solid #1f2433;border-radius:3px;background:#7fcfa8}
.ls-door i.ls-out{background:#e5484d}
.ls-hint{min-height:1.2em;padding:0 2px;margin:0;font-size:.92em;color:#f4efe4;text-shadow:0 1px 0 #121628,0 0 4px #121628;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-theme="light"] .ls-hint{color:#1f2433;text-shadow:0 1px 0 #e9dfd3,0 0 4px #e9dfd3}
.ls-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0}
.ls~[data-fizlet-slot] .ls-card{position:absolute;left:50%;top:50%;translate:-50% -50%;rotate:-1.5deg;display:grid;justify-items:center;gap:.5em;width:min(84%,24em);padding:1em 1.2em 1.1em;background:var(--surface);color:var(--ink);border:2.5px solid var(--rim);border-radius:12px;box-shadow:calc(6px * var(--bui-sx)) calc(6px * var(--bui-sy)) 0 var(--bui-shadow);text-align:center;pointer-events:auto}
.ls~[data-fizlet-slot] .ls-card[hidden],.ls-card p[hidden]{display:none}
.ls-card>b{font-size:1.9em}
.ls-card p{margin:0;color:var(--muted)}
.ls-card .ls-stats{color:var(--ink)}
.ls-card .ls-stats:empty{display:none}
.ls~[data-fizlet-slot] .ls-card.ls-start{top:66%}
.ls~[data-fizlet-slot] .ls-go{min-height:44px;padding:0 1.2em;font:inherit;background:var(--k-go);color:var(--rim)}
.ls~[data-fizlet-slot] .gk.ls-drop{background:var(--k-go);color:var(--rim);min-width:88px}
@container stage (aspect-ratio<7/5){
.ls~[data-fizlet-slot] .ls-hud{font-size:clamp(11px,3.2cqw,14px)}
.ls-hint{white-space:normal}
.ls-head{right:56px}
.ls~[data-fizlet-slot] .ls-card{top:46%}
}
[data-fizlet-slot]:focus-within .ls-play:focus-visible{outline:3px solid #f2a541}
