<div class="mm" aria-hidden="true"><style>
/* Mirror Maze (site/gallery/pieces/mirror/mirror-maze.ts): the diorama draws on the scene's canvas
   (the whole stage); over it, a transparent key takes the pointer and the keyboard's focus, Board UI
   stickers show the board, the moves and the par, a line of help sits under them and the end card
   comes up in the middle. The keys (mute, reset) are the gallery's keys strip
   (site/gallery/pieces/keys.ts), and the camera frames the tray between the stickers and the strip.
   Wide: the tray from the front. Square or tall: from its side, the grid long way into the picture.
   Dark: a neon night. Light: a pastel afternoon. */
.mm{position:absolute;inset:0;background:#10132a}
html[data-theme="light"] .mm{background:#eee8e0}
.mm-poster,.mm~[data-fizlet-slot]>canvas,.mm~[data-fizlet-slot]>.mm-play{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.mm-poster{object-fit:cover}
.mm~[data-fizlet-slot]>.mm-play{pointer-events:auto;border:0;margin:0;padding:0;background:transparent;box-shadow:none;transition:none;cursor:grab;touch-action:pan-y;-webkit-tap-highlight-color:transparent;outline-offset:-4px}
.mm~[data-fizlet-slot]>.mm-play.mm-aim{cursor:crosshair}
.mm~[data-fizlet-slot]>.mm-play.mm-drag{cursor:grabbing}
.mm~[data-fizlet-slot] .mm-hud{position:absolute;inset:0;pointer-events:none;font:800 clamp(11px,1.6cqw,14px)/1.2 ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif;color:var(--ink)}
.mm-head{position:absolute;left:8px;top:8px;right:8px;display:grid;gap:6px}
.mm-top{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0}
.mm~[data-fizlet-slot] .mm-chip{display:inline-flex;align-items:center;gap:.45em;padding:.4em .7em;background:var(--surface);color:var(--ink);border:2px solid var(--rim);border-radius:8px;box-shadow:calc(3px * var(--bui-sx)) calc(3px * var(--bui-sy)) 0 var(--bui-shadow);white-space:nowrap}
.mm-chip span{font-variant-numeric:tabular-nums;margin-right:.35em}
.mm~[data-fizlet-slot] .mm-lvl{color:#1f2433;background:#ffd36b;rotate:-1.5deg}
.mm~[data-fizlet-slot] .mm-over{background:#ffe1d6;color:#1f2433}
.mm-hint{min-height:1.2em;padding:0 2px;margin:0;font-size:.92em;color:#f4efe4;text-shadow:0 1px 0 #10132a,0 0 4px #10132a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-theme="light"] .mm-hint{color:#1f2433;text-shadow:0 1px 0 #eee8e0,0 0 4px #eee8e0}
.mm-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0}
.mm~[data-fizlet-slot] .mm-card{position:absolute;left:50%;top:46%;translate:-50% -50%;rotate:-1.5deg;display:grid;justify-items:center;gap:.5em;width:min(84%,22em);padding:1em 1.2em 1.1em;background:var(--surface);color:var(--ink);border:2.5px solid var(--rim);border-radius:12px;box-shadow:calc(6px * var(--bui-sx)) calc(6px * var(--bui-sy)) 0 var(--bui-shadow);text-align:center;pointer-events:auto}
.mm~[data-fizlet-slot] .mm-card[hidden]{display:none}
.mm-card>b{font-size:1.9em}
.mm-card p{margin:0;color:var(--muted)}
.mm-card .mm-stats{color:var(--ink)}
.mm~[data-fizlet-slot] .mm-again{min-height:44px;padding:0 1.2em;font:inherit;background:var(--k-go);color:var(--rim)}
.bui 
.mm~[data-fizlet-slot] .gk[disabled]{opacity:.45}
.mm~[data-fizlet-slot] .gk b{font-weight:inherit}
@container stage (aspect-ratio<7/5){
.mm-head{right:56px}
.mm~[data-fizlet-slot] .mm-hud{font-size:clamp(11px,3.2cqw,14px)}
.mm-hint{white-space:normal}

}
[data-fizlet-slot]:focus-within .mm-play:focus-visible{outline:3px solid #f08e6f}
