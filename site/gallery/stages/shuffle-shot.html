<div class="ss" aria-hidden="true"><style>
/* Shuffle Shot (site/gallery/pieces/shuffle/shuffle-shot.ts): the diorama draws on the scene's canvas (the
   whole stage); over it, a transparent key takes the pointer and the keyboard's focus, Board UI
   stickers show the turn and the score, a line of help sits under them and the end card comes up in
   the middle. The keys (mute, view) are the gallery's keys strip (site/gallery/pieces/keys.ts).
   Wide: the table from the side. Square or tall: down the lane from behind the line. Dark: a neon
   night under two pendants. Light: a bright afternoon. */
.ss{position:absolute;inset:0;background:#120f1f}
html[data-theme="light"] .ss{background:#f1e9df}
.ss-poster,.ss~[data-fizlet-slot]>canvas,.ss~[data-fizlet-slot]>.ss-play{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.ss-poster{object-fit:cover}
.ss~[data-fizlet-slot]>.ss-play{pointer-events:auto;border:0;margin:0;padding:0;background:transparent;box-shadow:none;transition:none;cursor:grab;touch-action:none;-webkit-tap-highlight-color:transparent;outline-offset:-4px}
.ss~[data-fizlet-slot]>.ss-play.ss-drag{cursor:grabbing}
.ss~[data-fizlet-slot] .ss-hud{position:absolute;inset:0;pointer-events:none;font:800 clamp(11px,1.6cqw,14px)/1.2 ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif;color:var(--ink)}
.ss-head{position:absolute;left:8px;top:8px;right:8px;display:grid;gap:6px}
.ss-top{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0}
.ss~[data-fizlet-slot] .ss-chip{display:inline-flex;align-items:center;gap:.45em;padding:.4em .7em;background:var(--surface);color:var(--ink);border:2px solid var(--rim);border-radius:8px;box-shadow:calc(3px * var(--bui-sx)) calc(3px * var(--bui-sy)) 0 var(--bui-shadow);white-space:nowrap}
.ss-chip span{font-variant-numeric:tabular-nums;margin-right:.35em}
.ss-chip em{font-style:normal;color:var(--muted);font-size:.85em}
.ss-dot{display:inline-block;width:.75em;height:.75em;border:2px solid var(--rim);border-radius:50%;background:#f07f68}
.ss-dot.ss-foe{background:#6f9fd8}
.ss~[data-fizlet-slot] .ss-turn{background:#f07f68;color:#1f2433;rotate:-1.5deg}
.ss~[data-fizlet-slot] .ss-turn.ss-them{background:#6f9fd8}
.ss-hint{min-height:1.2em;padding:0 2px;margin:0;font-size:.92em;color:#f4efe4;text-shadow:0 1px 0 #120f1f,0 0 4px #120f1f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-theme="light"] .ss-hint{color:#1f2433;text-shadow:0 1px 0 #f1e9df,0 0 4px #f1e9df}
.ss-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0}
.ss~[data-fizlet-slot] .ss-card{position:absolute;left:50%;top:46%;translate:-50% -50%;rotate:-1.5deg;display:grid;justify-items:center;gap:.5em;width:min(84%,20em);padding:1em 1.2em 1.1em;background:var(--surface);color:var(--ink);border:2.5px solid var(--rim);border-radius:12px;box-shadow:calc(6px * var(--bui-sx)) calc(6px * var(--bui-sy)) 0 var(--bui-shadow);text-align:center;pointer-events:auto}
.ss~[data-fizlet-slot] .ss-card[hidden]{display:none}
.ss-card>b{font-size:1.9em}
.ss-card p{margin:0;color:var(--muted)}
.ss~[data-fizlet-slot] .ss-again{min-height:44px;padding:0 1.2em;font:inherit;background:var(--k-go);color:var(--rim)}
@container stage (aspect-ratio<7/5){
.ss-head{right:56px}
.ss~[data-fizlet-slot] .ss-hud{font-size:clamp(11px,3.2cqw,14px)}
.ss-hint{white-space:normal}
.ss-chip em{display:none}
}
[data-fizlet-slot]:focus-within .ss-play:focus-visible{outline:3px solid #f07f68}
</style></div>
