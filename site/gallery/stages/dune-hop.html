<div class="dh" aria-hidden="true"><style>
/* Dune Hop (site/gallery/pieces/dune/dune-hop.ts): the tabletop course, the sky behind it and the
   buggy draw on the scene's canvas; over it a transparent key takes the pointer (hold for gas, drag to
   steer) and the keyboard's focus. Board UI stickers: gate and lap, the clock, the score and combo on
   top, a line of help under them, the jump calls in the middle, the view and mute keys in the corner,
   the finish card. The touch keys are @fzlt/core/pad: on touch screens only when wide; square or tall
   (a phone held upright), the course on top and the pad under it. Dark: neon dunes at night. Light: a
   hot sunset. */
.dh{position:absolute;inset:0;background:#0d0b1c}
html[data-theme="light"] .dh{background:#9c5f45}
.dh-poster,.dh~[data-fizlet-slot]>canvas,.dh~[data-fizlet-slot]>.dh-play{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.dh-poster{object-fit:cover}
.dh~[data-fizlet-slot]>.dh-play{pointer-events:auto;border:0;margin:0;padding:0;background:transparent;box-shadow:none;transition:none;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;outline-offset:-4px}
.dh~[data-fizlet-slot] .dh-hud{position:absolute;inset:0;pointer-events:none;font:900 clamp(10px,1.7cqw,14px)/1.15 ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif;color:var(--ink)}
.dh-head{position:absolute;left:8px;top:8px;right:112px;display:grid;gap:6px}
.dh-top{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0}
.dh~[data-fizlet-slot] .dh-chip{display:inline-flex;align-items:center;gap:.4em;padding:.4em .7em;background:var(--surface);color:var(--ink);border:2px solid var(--rim);border-radius:8px;box-shadow:calc(3px * var(--bui-sx)) calc(3px * var(--bui-sy)) 0 var(--bui-shadow);white-space:nowrap;font-variant-numeric:tabular-nums}
.dh~[data-fizlet-slot] .dh-gate{rotate:-1.5deg}
.dh~[data-fizlet-slot] .dh-time span{min-width:5.2ch}
.dh~[data-fizlet-slot] .dh-score{rotate:1deg}
.dh-score i{font-style:normal;padding:.05em .4em;border:2px solid var(--rim);border-radius:6px;background:var(--surface)}
.dh~[data-fizlet-slot] .dh-score i.dh-hot{background:#ff4fa8;color:#0b0a14}
.dh-hint{min-height:1.2em;margin:0;padding:0 2px;font-size:.92em;color:#f4efff;text-shadow:0 1px 0 #0d0b1c,0 0 4px #0d0b1c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-theme="light"] .dh-hint{color:#1b1420;text-shadow:0 1px 0 #ffd29a,0 0 4px #ffd29a}
.dh~[data-fizlet-slot] .dh-toast{position:absolute;left:50%;top:30%;translate:-50% 0;rotate:-2deg;margin:0;padding:.45em .8em;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--rim);color:#f6f3ff;border:2px solid var(--rim);border-radius:8px;box-shadow:calc(4px * var(--bui-sx)) calc(4px * var(--bui-sy)) 0 var(--bui-shadow);font-size:1.1em;letter-spacing:.03em}
.dh~[data-fizlet-slot] .dh-toast.dh-clean{background:#22e6ff;color:#0b0a14}
.dh~[data-fizlet-slot] .dh-toast.dh-go{background:var(--k-go);color:var(--rim)}
.dh~[data-fizlet-slot] .dh-toast.dh-meh{background:#ffd166;color:#0b0a14}
.dh~[data-fizlet-slot] .dh-toast.dh-bad{background:#ff4f5e;color:#0b0a14;rotate:2deg}
.dh~[data-fizlet-slot] .dh-toast[hidden],.dh~[data-fizlet-slot] .dh-card[hidden]{display:none}
.dh-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0}
.dh-keys{position:absolute;right:8px;top:8px;display:flex;gap:6px;margin:0}
.dh~[data-fizlet-slot] .dh-key{min-width:44px;height:44px;padding:0 .7em;font:inherit;cursor:pointer;pointer-events:auto;background:var(--surface);color:var(--ink);border:2px solid var(--rim);border-radius:22px;box-shadow:calc(3px * var(--bui-sx)) calc(3px * var(--bui-sy)) 0 var(--bui-shadow)}
.dh~[data-fizlet-slot] .dh-card{position:absolute;left:50%;top:46%;translate:-50% -50%;rotate:-1.5deg;display:grid;justify-items:center;gap:.4em;width:min(84%,24em);padding:.9em 1.1em 1em;background:var(--surface);color:var(--ink);border:2.5px solid var(--rim);border-radius:12px;box-shadow:calc(6px * var(--bui-sx)) calc(6px * var(--bui-sy)) 0 var(--bui-shadow);text-align:center;pointer-events:auto}
.dh-card>b{font-size:2em;letter-spacing:.06em}
.dh-card p{margin:0}
.dh-card .dh-t{font-size:1.5em;font-variant-numeric:tabular-nums}
.dh-card .dh-stats{color:var(--muted);line-height:1.35}
.dh~[data-fizlet-slot] .dh-again{min-height:44px;padding:0 1.2em;font:inherit;background:var(--k-go);color:var(--rim)}
.dh~[data-fizlet-slot] .dh-pad{--u:.62px;display:none}
.dh~[data-fizlet-slot] .dh-pad .bui-pad-keys{max-width:none;flex-wrap:nowrap}
@media (pointer:coarse){.dh~[data-fizlet-slot] .dh-pad{display:flex}}
@container stage (aspect-ratio<7/5){
.dh,.dh~[data-fizlet-slot]{--padh:clamp(96px,22cqh,120px)}
.dh-poster,.dh~[data-fizlet-slot]>canvas,.dh~[data-fizlet-slot]>.dh-play{height:calc(100cqh - var(--padh))}
.dh~[data-fizlet-slot] .dh-hud{font-size:clamp(11px,3.3cqw,14px)}
.dh-head{right:8px;top:60px}
.dh-hint{white-space:normal}
.dh~[data-fizlet-slot] .dh-pad{display:flex;--u:.72px;gap:calc(8 * var(--u));padding-inline:calc(8 * var(--u))}
.dh~[data-fizlet-slot] .dh-card{top:calc((100cqh - var(--padh)) / 2);font-size:.85em}
.dh~[data-fizlet-slot] .dh-toast{top:calc((100cqh - var(--padh)) * .42)}
}
[data-fizlet-slot]:focus-within .dh-play:focus-visible{outline:3px solid #22e6ff}
</style></div>
