<div class="rg" data-rg aria-hidden="true"><style>
/* Toast Tell (site/gallery/pieces/toast-tell.ts): the hall, the ring and both fighters draw on the
   scene's canvas; SLIP, DUCK and PUNCH are small Board UI keys (keys.ts, 44 px or more) in a strip on the
   stage's bottom edge, under the ground line.
   Dark: fight night. Light: an afternoon gym. Colours: Board UI token roles. */
.rg{position:absolute;inset:0;--rg-back:#0c0a1c;--rg-crowd:#2a1c4a;--rg-mat:#3f296a;--rg-rope:#ff2e88;--rg-ink:#07060f;--rg-paper:#f6f3ff;--rg-red:#ff2b4e;--rg-cyan:#19f0ff;--rg-gold:#ffc21a;--rg-go:#39ffb0;--rg-purple:#9a63ff;--rg-pink:#ff7389;--rg-steel:#b9b4d6;--rg-dark:1;background:#0c0a1c}
html[data-theme="light"] .rg{--rg-back:#e9e4ff;--rg-crowd:#c9bdf5;--rg-mat:#9a63ff;--rg-go:#0f9e6a;--rg-steel:#cfcbe6;--rg-dark:0;background:#e9e4ff}
/* The art's 16:9 box (the poster and the live canvas): the whole of a wide stage; on a square or
   tall one, just over the keys' 56 px strip (keys.ts); on a short wide one (a phone pinned wide),
   smaller and centred over the strip. The skin's colours fill around it. */
.rg-poster,.rg~[data-fizlet-slot]>canvas{position:absolute;left:0;width:100%;height:56.25cqw;top:max(0px,100cqh - 56.25cqw - 56px);pointer-events:none}
@container stage (max-height:330px){.rg-poster,.rg~[data-fizlet-slot]>canvas{top:0;height:calc(100cqh - 56px);width:calc((100cqh - 56px) * 16 / 9);left:calc(50cqw - (100cqh - 56px) * 8 / 9)}}
.rg{box-shadow:inset 0 -56px var(--rg-mat)}
[data-fizlet-slot]:focus-visible{outline:3px solid #19f0ff;outline-offset:-3px}
</style></div>
