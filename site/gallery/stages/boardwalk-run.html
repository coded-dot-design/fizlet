<div class="bw" data-bw aria-hidden="true"><style>
/* Boardwalk Run (site/gallery/pieces/skate/boardwalk-run.ts): the boardwalk, the sea, the sky and the
   rider draw on the scene's canvas (the art's 16:9 box); the bottom bar (distance, time, score), the
   combo line and the score card are Board UI stickers over it, and the touch keys are @fzlt/core/pad.
   Wide: the art fills the stage, the bar sits on its sand; the pad shows on touch screens only (the
   keyboard plays it otherwise). Square or tall (a phone held upright): the art on top, the bar under
   it, the pad under the bar. Light: a pastel sunset. Dark: dusk, the sun nearly down. Colours: Board
   UI token roles, plus sand, sea and plank wood. */
.bw{position:absolute;inset:0;--bw-sky:#2a1c4a;--bw-sky2:#7a3d8f;--bw-sky3:#ff7389;--bw-sun:#ffc21a;--bw-sea:#1d2f5e;--bw-sea2:#ff9db0;--bw-deck:#9a5f34;--bw-deck2:#6e3f22;--bw-face:#4a2a18;--bw-sand:#c9a46c;--bw-rail:#e6e4f8;--bw-ink:#07060f;--bw-paper:#f6f3ff;--bw-tank:#19f0ff;--bw-shorts:#9a63ff;--bw-skin:#ffd2a8;--bw-hair:#3b1d0e;--bw-visor:#ff2e88;--bw-board:#39ffb0;--bw-barrel:#ff2e88;--bw-ball1:#ff2e88;--bw-ball2:#f6f3ff;--bw-shade:rgba(7,6,15,.4);--bw-gold:#ffc21a;--bw-go:#39ffb0;--bw-hot:#ff8a1f;--bw-shack:#3b8fa8;--bw-cloud:rgba(255,157,176,.35);background:#2a1c4a}
html[data-theme="light"] .bw{--bw-sky:#b9a8ff;--bw-sky2:#ffb3cf;--bw-sky3:#ffd9a8;--bw-sun:#fff1b0;--bw-sea:#4aa3c9;--bw-sea2:#c8f0ff;--bw-deck:#e0a066;--bw-deck2:#b5703d;--bw-face:#8a5230;--bw-sand:#f2d59b;--bw-rail:#f6f3ff;--bw-hair:#6b3a1f;--bw-tank:#006e91;--bw-shorts:#6a3ae6;--bw-board:#0b7a54;--bw-shade:rgba(27,22,54,.25);--bw-shack:#9fe8ff;--bw-cloud:rgba(255,255,255,.6);background:#b9a8ff}
.bw-poster,.bw~[data-fizlet-slot]>canvas,.bw~[data-fizlet-slot]>.bw-play{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.bw~[data-fizlet-slot]>.bw-play{pointer-events:auto;border:0;margin:0;padding:0;background:transparent;box-shadow:none;transition:none;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;outline-offset:-4px}
.bw~[data-fizlet-slot] .bw-hud{position:absolute;inset:0;pointer-events:none;font:900 clamp(10px,1.9cqw,15px)/1 ui-monospace,monospace;color:var(--ink)}
.bw~[data-fizlet-slot] .bw-chip{display:flex;align-items:center;gap:.45em;margin:0;padding:.45em .7em;background:var(--surface);color:var(--ink);border:2px solid var(--rim);border-radius:8px;box-shadow:calc(3px * var(--bui-sx)) calc(3px * var(--bui-sy)) 0 var(--bui-shadow);white-space:nowrap}
.bw-chip small{font-size:.62em;letter-spacing:.14em;color:var(--muted)}
.bw-chip span{min-width:2ch;font-size:1.2em;font-variant-numeric:tabular-nums}
.bw~[data-fizlet-slot] .bw-bar{position:absolute;left:8px;right:8px;bottom:8px;display:flex;justify-content:center;gap:.6em}
.bw-bar>:first-child{rotate:-1.5deg}.bw-bar>:first-child span{color:var(--k-sys-ink)}
.bw-bar>:last-child{rotate:1.5deg}
.bw~[data-fizlet-slot] .bw-mute{position:absolute;right:6px;top:4px;width:44px;height:44px;justify-content:center;padding:0;font-size:16px;cursor:pointer;pointer-events:auto;border-radius:22px}
.bw~[data-fizlet-slot] .bw-combo{position:absolute;left:50%;top:8px;translate:-50% 0;max-width:calc(100% - 120px);margin:0;padding:.4em .7em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--rim);color:#f6f3ff;border-radius:6px;font-size:.92em;rotate:-1deg}
.bw-combo b{color:var(--hurt)}
.bw-combo em{font-style:normal;color:var(--k-go)}
.bw~[data-fizlet-slot] .bw-combo.bw-bank{background:var(--k-go);color:var(--rim)}
.bw-combo.bw-bank em{color:var(--rim)}
.bw~[data-fizlet-slot] .bw-combo.bw-bail{background:var(--k-fire)}
.bw~[data-fizlet-slot] .bw-combo[hidden],.bw~[data-fizlet-slot] .bw-card[hidden]{display:none}
.bw~[data-fizlet-slot] .bw-card{position:absolute;left:50%;top:44%;translate:-50% -50%;rotate:-2deg;display:grid;justify-items:center;gap:.35em;width:min(84%,26em);padding:.9em 1em 1em;background:var(--k-flag);color:var(--rim);border:2.5px solid var(--rim);border-radius:10px;box-shadow:calc(5px * var(--bui-sx)) calc(5px * var(--bui-sy)) 0 var(--bui-shadow);text-align:center}
.bw-card small{letter-spacing:.3em;font-size:.75em}
.bw-card>b{font-size:2.4em;letter-spacing:.04em}
.bw-card p{margin:0;font-size:.85em;letter-spacing:.06em}
.bw-card strong{color:#006e91}
.bw-card .bw-best{font-size:.75em;color:#5d5684;white-space:normal;line-height:1.3}
.bw-card .bw-again{margin-top:.3em;padding:.35em .8em;background:var(--k-go);border:2px solid var(--rim);border-radius:6px}
.bw~[data-fizlet-slot] .bw-pad{--u:.62px;display:none}
.bw~[data-fizlet-slot] .bw-pad .bui-pad-keys{max-width:none;flex-wrap:nowrap}
@media (pointer:coarse){.bw~[data-fizlet-slot] .bw-pad{display:flex}.bw~[data-fizlet-slot] .bw-bar{bottom:auto;top:52px}}
@container stage (aspect-ratio<7/5){
.bw,.bw~[data-fizlet-slot]{--padh:clamp(96px,22cqh,120px)}
.bw-poster,.bw~[data-fizlet-slot]>canvas,.bw~[data-fizlet-slot]>.bw-play{height:calc(100cqh - var(--padh))}
.bw-poster{object-fit:cover;object-position:0 100%}
html .bw.bw{background:var(--bw-sand)}
.bw~[data-fizlet-slot] .bw-hud{font-size:clamp(11px,3.4cqw,15px)}
.bw~[data-fizlet-slot] .bw-bar{top:auto;bottom:calc(var(--padh) + 8px)}
.bw~[data-fizlet-slot] .bw-pad{display:flex;--u:.72px;gap:calc(8 * var(--u));padding-inline:calc(8 * var(--u))}
.bw~[data-fizlet-slot] .bw-combo{top:4px;max-width:calc(100% - 64px);left:8px;translate:none}
.bw~[data-fizlet-slot] .bw-card{top:calc((100cqh - var(--padh)) / 2.2);font-size:.8em;gap:.25em;padding:.6em .8em .7em}
}
[data-fizlet-slot]:focus-within .bw-play:focus-visible{outline:3px solid #19f0ff}
</style></div>
