<div class="fm" aria-hidden="true"><style>
/* Flip Match (site/gallery/pieces/flip/flip-match.ts): the diorama draws on the scene's canvas (the
   whole stage); over it, a transparent key takes the pointer and the keyboard's focus, Board UI
   stickers show the moves, the pairs and the time, a line of help sits under them and the end card
   comes up in the middle. The keys (mute, new deal) are the gallery's keys strip
   (site/gallery/pieces/keys.ts). Wide: the grid with the deck and your pile at its sides. Square or
   tall: the deck and your pile under the grid. Dark: a lamp-lit night. Light: a bright afternoon. */
.fm{position:absolute;inset:0;background:#120f1f}
html[data-theme="light"] .fm{background:#f1e9df}
.fm-poster,.fm~[data-fizlet-slot]>canvas,.fm~[data-fizlet-slot]>.fm-play{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.fm-poster{object-fit:cover}
.fm~[data-fizlet-slot]>.fm-play{pointer-events:auto;border:0;margin:0;padding:0;background:transparent;box-shadow:none;transition:none;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;outline-offset:-4px}
.fm~[data-fizlet-slot] .fm-hud{position:absolute;inset:0;pointer-events:none;font:800 clamp(11px,1.6cqw,14px)/1.2 ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif;color:var(--ink)}
.fm-head{position:absolute;left:8px;top:8px;right:8px;display:grid;gap:6px}
.fm-top{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0}
.fm~[data-fizlet-slot] .fm-chip{display:inline-flex;align-items:center;gap:.45em;padding:.4em .7em;background:var(--surface);color:var(--ink);border:2px solid var(--rim);border-radius:8px;box-shadow:calc(3px * var(--bui-sx)) calc(3px * var(--bui-sy)) 0 var(--bui-shadow);white-space:nowrap}
.fm-chip span{font-variant-numeric:tabular-nums}
.fm~[data-fizlet-slot] .fm-turn{background:#ffd36b;color:#1f2433;rotate:-1.5deg}
.fm-hint{min-height:1.2em;padding:0 2px;margin:0;font-size:.92em;color:#f4efe4;text-shadow:0 1px 0 #120f1f,0 0 4px #120f1f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-theme="light"] .fm-hint{color:#1f2433;text-shadow:0 1px 0 #f1e9df,0 0 4px #f1e9df}
.fm-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0}
.fm~[data-fizlet-slot] .fm-card{position:absolute;left:50%;top:46%;translate:-50% -50%;rotate:-1.5deg;display:grid;justify-items:center;gap:.5em;width:min(84%,20em);padding:1em 1.2em 1.1em;background:var(--surface);color:var(--ink);border:2.5px solid var(--rim);border-radius:12px;box-shadow:calc(6px * var(--bui-sx)) calc(6px * var(--bui-sy)) 0 var(--bui-shadow);text-align:center;pointer-events:auto}
.fm~[data-fizlet-slot] .fm-card[hidden]{display:none}
.fm-card>b{font-size:1.9em}
.fm-card p{margin:0;color:var(--muted)}
.fm~[data-fizlet-slot] .fm-again{min-height:44px;padding:0 1.2em;font:inherit;background:var(--k-go);color:var(--rim)}
@container stage (aspect-ratio<7/5){
.fm-head{right:56px}
.fm~[data-fizlet-slot] .fm-hud{font-size:clamp(11px,3.2cqw,14px)}
.fm-hint{white-space:normal}
}
[data-fizlet-slot]:focus-within .fm-play:focus-visible{outline:3px solid #f07f68}
</style></div>
