<div class="fpr" aria-hidden="true"><style>/* The keys (RADIO, sound) sit as a pair at the bottom centre, between the wall columns, where no tank,
   wall or flag rests; their rules outrank the page's Board UI button rule ([data-fizlet-slot]). */
.fpr{position:absolute;inset:0;container-type:size;overflow:hidden;background:#120f26 repeating-linear-gradient(0deg,transparent 0 5.15cqw,#1d1738 5.15cqw 5.7cqw),repeating-linear-gradient(90deg,#120f26 0 5.15cqw,#1d1738 5.15cqw 5.7cqw)}
html[data-theme="light"] .fpr{background:#eef0fb repeating-linear-gradient(0deg,transparent 0 5.15cqw,#e6e4f8 5.15cqw 5.7cqw),repeating-linear-gradient(90deg,#eef0fb 0 5.15cqw,#e6e4f8 5.15cqw 5.7cqw)}
.fpr-cv{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated;touch-action:none}
[data-fizlet-slot] .fpr-k{user-select:none;-webkit-user-select:none;position:absolute;bottom:2.4cqw;box-sizing:border-box;min-width:44px;min-height:44px;height:7cqw;margin:0;padding:0 2.2cqw;border:max(2px,.45cqw) solid #07060f;border-radius:1.2cqw;font:800 max(12px,2.1cqw)/1 var(--mono,ui-monospace,monospace);letter-spacing:.12em;cursor:pointer;box-shadow:calc(.7cqw * var(--shadow-x, 0)) calc(.7cqw * var(--shadow-y, 1)) 0 #07060f;touch-action:manipulation}
[data-fizlet-slot] .fpr-k:active{translate:0 .5cqw;box-shadow:calc(.2cqw * var(--shadow-x, 0)) calc(.2cqw * var(--shadow-y, 1)) 0 #07060f}
[data-fizlet-slot] .fpr-k:focus-visible{outline:max(2px,.4cqw) solid #19f0ff;outline-offset:.4cqw}
[data-fizlet-slot] .fpr-go{left:51cqw;background:#39ffb0;color:#07060f}
[data-fizlet-slot] .fpr-go::after{content:"RADIO \25B8"}
[data-fizlet-slot] .fpr-go[data-live]{background:#19f0ff}
[data-fizlet-slot] .fpr-go[data-live]::after{content:"FREEZE \275A\275A"}
[data-fizlet-slot] .fpr-snd{right:51cqw;background:#9a63ff;color:#f6f3ff}
[data-fizlet-slot] .fpr-snd::after{content:"\266A ON"}
[data-fizlet-slot] .fpr-snd[aria-pressed="true"]::after{content:"\266A OFF"}
[data-fizlet-slot] .fpr-snd[hidden]{display:none}
/* A phone-sized board: two 44 px icon keys (their names stay in aria-label), clear of the walls. */
@container (max-width:480px){[data-fizlet-slot] .fpr-k{width:44px;padding:0}[data-fizlet-slot] .fpr-go{left:calc(50% + 2px)}[data-fizlet-slot] .fpr-snd{right:calc(50% + 2px)}[data-fizlet-slot] .fpr-go::after{content:"\25B8"}[data-fizlet-slot] .fpr-go[data-live]::after{content:"\275A\275A"}[data-fizlet-slot] .fpr-snd::after{content:"\266A"}[data-fizlet-slot] .fpr-snd[aria-pressed="true"]::after{content:"\2715"}}
.fpr-poster{position:absolute;inset:0;width:100%;height:100%;image-rendering:pixelated}</style></div>
