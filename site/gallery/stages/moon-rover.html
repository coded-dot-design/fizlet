<div class="mr" aria-hidden="true"><style>
/* Moon Rover (site/gallery/pieces/orb/moon-rover.ts): the moon, the sky behind it, the rover and
   the chasers draw on the scene's canvas; over it a transparent key takes the keyboard's focus.
   Board UI stickers: the clock, the next beacon and lap, crystals and score on top, shields and the
   boost meter under them, a line of help, the calls in the middle, mute in the corner, the end card.
   The touch controls are @fzlt/core/pad (a stick: steer, up for gas, down to brake; FIRE, BOOST and
   JUMP): on touch screens only when wide; square or tall, the moon on top and the pad under it.
   Dark: a neon night in space. Light: a pastel day. The moon keeps its own day and night in both. */
.mr{position:absolute;inset:0;background:#03041a}
html[data-theme="light"] .mr{background:#b9c3f5}
.mr-poster,.mr~[data-fizlet-slot]>canvas,.mr~[data-fizlet-slot]>.mr-play{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.mr-poster{object-fit:cover}
.mr~[data-fizlet-slot]>.mr-play{pointer-events:auto;border:0;margin:0;padding:0;background:transparent;box-shadow:none;transition:none;cursor:default;touch-action:none;-webkit-tap-highlight-color:transparent;outline-offset:-4px}
.mr~[data-fizlet-slot] .mr-hud{position:absolute;inset:0;pointer-events:none;font:900 clamp(10px,1.7cqw,14px)/1.15 ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif;color:var(--ink)}
.mr-head{position:absolute;left:8px;top:8px;right:64px;display:grid;gap:6px}
.mr-top,.mr-sub{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0}
.mr~[data-fizlet-slot] .mr-chip{display:inline-flex;align-items:center;gap:.4em;padding:.4em .7em;background:var(--surface);color:var(--ink);border:2px solid var(--rim);border-radius:8px;box-shadow:calc(3px * var(--bui-sx)) calc(3px * var(--bui-sy)) 0 var(--bui-shadow);white-space:nowrap;font-variant-numeric:tabular-nums}
.mr~[data-fizlet-slot] .mr-time{rotate:-1.5deg}
.mr~[data-fizlet-slot] .mr-time span{min-width:3.6ch}
.mr~[data-fizlet-slot] .mr-time.mr-low{background:#ff4f5e;color:#0b0a14}
.mr~[data-fizlet-slot] .mr-bea{background:#ff4fa8;color:#0b0a14}
.mr-cry i{font-style:normal;color:#ff4fd8}
html[data-theme="light"] .mr-cry i{color:#ff4fb0}
.mr~[data-fizlet-slot] .mr-score{rotate:1deg}
.mr-shd{gap:.3em}
.mr-shd i{display:block;width:.9em;height:.9em;rotate:45deg;background:#22e6ff;border:2px solid var(--rim);border-radius:2px}
html[data-theme="light"] .mr-shd i{background:#13a9bb}
.mr-shd i.mr-off{background:transparent;opacity:.45}
.mr-boost em{font-style:normal;font-size:.82em;letter-spacing:.06em}
.mr-boost u{display:block;width:4.6em;height:.7em;border:2px solid var(--rim);border-radius:4px;overflow:hidden;text-decoration:none}
.mr-boost s{display:block;height:100%;width:100%;background:#ffb35c;text-decoration:none}
.mr-boost.mr-full s{background:#39ffb0}
html[data-theme="light"] .mr-boost.mr-full s{background:#2fbf7f}
.mr-hint{min-height:1.2em;margin:0;padding:0 2px;font-size:.92em;color:#f4efff;text-shadow:0 1px 0 #03041a,0 0 4px #03041a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-theme="light"] .mr-hint{color:#1b1420;text-shadow:0 1px 0 #dcd2fa,0 0 4px #dcd2fa}
.mr~[data-fizlet-slot] .mr-toast{position:absolute;left:50%;top:34%;translate:-50% 0;rotate:-2deg;margin:0;padding:.45em .8em;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--rim);color:#f6f3ff;border:2px solid var(--rim);border-radius:8px;box-shadow:calc(4px * var(--bui-sx)) calc(4px * var(--bui-sy)) 0 var(--bui-shadow);font-size:1.1em;letter-spacing:.03em}
.mr~[data-fizlet-slot] .mr-toast.mr-clean{background:#22e6ff;color:#0b0a14}
.mr~[data-fizlet-slot] .mr-toast.mr-go{background:var(--k-go);color:var(--rim)}
.mr~[data-fizlet-slot] .mr-toast.mr-meh{background:#ffd166;color:#0b0a14}
.mr~[data-fizlet-slot] .mr-toast.mr-bad{background:#ff4f5e;color:#0b0a14;rotate:2deg}
.mr~[data-fizlet-slot] .mr-toast[hidden],.mr~[data-fizlet-slot] .mr-card[hidden]{display:none}
.mr-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0}
.mr-keys{position:absolute;right:8px;top:8px;display:flex;gap:6px;margin:0}
.mr~[data-fizlet-slot] .mr-key{min-width:44px;height:44px;padding:0 .7em;font:inherit;cursor:pointer;pointer-events:auto;background:var(--surface);color:var(--ink);border:2px solid var(--rim);border-radius:22px;box-shadow:calc(3px * var(--bui-sx)) calc(3px * var(--bui-sy)) 0 var(--bui-shadow)}
.mr~[data-fizlet-slot] .mr-card{position:absolute;left:50%;top:46%;translate:-50% -50%;rotate:-1.5deg;display:grid;justify-items:center;gap:.4em;width:min(84%,25em);padding:.9em 1.1em 1em;background:var(--surface);color:var(--ink);border:2.5px solid var(--rim);border-radius:12px;box-shadow:calc(6px * var(--bui-sx)) calc(6px * var(--bui-sy)) 0 var(--bui-shadow);text-align:center;pointer-events:auto}
.mr-card>b{font-size:2em;letter-spacing:.06em}
.mr-card p{margin:0}
.mr-card .mr-t{font-size:1.5em;font-variant-numeric:tabular-nums}
.mr-card .mr-stats{color:var(--muted);line-height:1.35}
.mr~[data-fizlet-slot] .mr-again{min-height:44px;padding:0 1.2em;font:inherit;background:var(--k-go);color:var(--rim)}
.mr~[data-fizlet-slot] .mr-pad{--u:.62px;display:none}
.mr~[data-fizlet-slot] .mr-pad .bui-pad-keys{max-width:none;flex-wrap:nowrap}
.mr~[data-fizlet-slot] .mr-pad svg{width:1.4em;height:1.4em;fill:currentColor;stroke:none}
@media (pointer:coarse){.mr~[data-fizlet-slot] .mr-pad{display:flex}}
@container stage (aspect-ratio<7/5){
.mr,.mr~[data-fizlet-slot]{--padh:clamp(104px,24cqh,128px)}
.mr-poster,.mr~[data-fizlet-slot]>canvas,.mr~[data-fizlet-slot]>.mr-play{height:calc(100cqh - var(--padh))}
.mr~[data-fizlet-slot] .mr-hud{font-size:clamp(11px,3.3cqw,14px)}
.mr-head{right:60px}
.mr-hint{white-space:normal}
.mr~[data-fizlet-slot] .mr-pad{display:flex;--u:.72px;gap:calc(8 * var(--u));padding-inline:calc(8 * var(--u))}
.mr~[data-fizlet-slot] .mr-card{top:calc((100cqh - var(--padh)) / 2);font-size:.85em}
.mr~[data-fizlet-slot] .mr-toast{top:calc((100cqh - var(--padh)) * .4)}
}
[data-fizlet-slot]:focus-within .mr-play:focus-visible{outline:3px solid #22e6ff}
</style></div>
