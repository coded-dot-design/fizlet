<div class="rr" aria-hidden="true"><style>
/* Rat Race (site/gallery/pieces/maze/rat-race.ts): the diorama draws on the scene's canvas (the
   whole stage); over it, a transparent key takes the pointer (a tap picks a room, a swipe a way to
   run) and the keyboard's focus, Board UI stickers show the round and the score, a line of help sits
   under them and the end card comes up in the middle. The keys (mute, a new race) are the gallery's
   keys strip (site/gallery/pieces/keys.ts); the camera frames the maze between the stickers and the
   strip. Wide: the maze from the front, steep. Square or tall: from its side. Dark: a neon night.
   Light: a pastel afternoon. */
.rr{position:absolute;inset:0;background:#10132a}
html[data-theme="light"] .rr{background:#eee8e0}
.rr-poster,.rr~[data-fizlet-slot]>canvas,.rr~[data-fizlet-slot]>.rr-play{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.rr-poster{object-fit:cover}
.rr~[data-fizlet-slot]>.rr-play{pointer-events:auto;border:0;margin:0;padding:0;background:transparent;box-shadow:none;transition:none;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;outline-offset:-4px}
.rr~[data-fizlet-slot] .rr-hud{position:absolute;inset:0;pointer-events:none;font:800 clamp(11px,1.6cqw,14px)/1.2 ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif;color:var(--ink)}
.rr-head{position:absolute;left:8px;top:8px;right:8px;display:grid;gap:6px}
.rr-top{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0}
.rr~[data-fizlet-slot] .rr-chip{display:inline-flex;align-items:center;gap:.45em;padding:.4em .7em;background:var(--surface);color:var(--ink);border:2px solid var(--rim);border-radius:8px;box-shadow:calc(3px * var(--bui-sx)) calc(3px * var(--bui-sy)) 0 var(--bui-shadow);white-space:nowrap}
.rr-chip span{font-variant-numeric:tabular-nums;margin-right:.35em}
.rr~[data-fizlet-slot] .rr-lvl{color:#1f2433;background:#ffd36b;rotate:-1.5deg}
.rr-hint{min-height:1.2em;padding:0 2px;margin:0;font-size:.92em;color:#f4efe4;text-shadow:0 1px 0 #10132a,0 0 4px #10132a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-theme="light"] .rr-hint{color:#1f2433;text-shadow:0 1px 0 #eee8e0,0 0 4px #eee8e0}
.rr-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0}
.rr~[data-fizlet-slot] .rr-card{position:absolute;left:50%;top:46%;translate:-50% -50%;rotate:-1.5deg;display:grid;justify-items:center;gap:.5em;width:min(84%,22em);padding:1em 1.2em 1.1em;background:var(--surface);color:var(--ink);border:2.5px solid var(--rim);border-radius:12px;box-shadow:calc(6px * var(--bui-sx)) calc(6px * var(--bui-sy)) 0 var(--bui-shadow);text-align:center;pointer-events:auto}
.rr~[data-fizlet-slot] .rr-card[hidden]{display:none}
.rr-card>b{font-size:1.9em}
.rr-card p{margin:0;color:var(--muted)}
.rr-card .rr-stats{color:var(--ink)}
.rr~[data-fizlet-slot] .rr-again{min-height:44px;padding:0 1.2em;font:inherit;background:var(--k-go);color:var(--rim)}
.bui 
.rr~[data-fizlet-slot] .gk[disabled]{opacity:.45}
.rr~[data-fizlet-slot] .gk b{font-weight:inherit}
@container stage (aspect-ratio<7/5){
.rr-head{right:56px}
.rr~[data-fizlet-slot] .rr-hud{font-size:clamp(11px,3.2cqw,14px)}
.rr-hint{white-space:normal}

}
[data-fizlet-slot]:focus-within .rr-play:focus-visible{outline:3px solid #ff8a6b}
.rr-dot{display:inline-block;width:.7em;height:.7em;border:2px solid #1f2433;border-radius:50%;background:#5fd3a8}
.rr-dot.rr-riv{background:#ff8a6b}
html:not([data-theme="light"]) .rr-dot{background:#7ffcff}
html:not([data-theme="light"]) .rr-dot.rr-riv{background:#ff3fa4}
.rr-card>b{font-size:1.9em}
