<div class="tm" aria-hidden="true"><style>
/* Tilt Maze (site/gallery/pieces/maze/tilt-maze.ts): the diorama draws on the scene's canvas (the
   whole stage); over it, a transparent key takes the pointer (a drag tilts the board, so it takes
   the touch too) and the keyboard's focus, Board UI stickers show the board, the time and best, the
   numbers passed and the falls, a line of help sits under them and the end card comes up in the
   middle. The keys (mute, reset, and TILT on phones) are the gallery's keys strip
   (site/gallery/pieces/keys.ts); the camera frames the box between the stickers and the strip.
   Wide: the box from the front. Square or tall: from its side. Dark: a neon night. Light: a pastel
   afternoon. */
.tm{position:absolute;inset:0;background:#10132a}
html[data-theme="light"] .tm{background:#eee8e0}
.tm-poster,.tm~[data-fizlet-slot]>canvas,.tm~[data-fizlet-slot]>.tm-play{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.tm-poster{object-fit:cover}
.tm~[data-fizlet-slot]>.tm-play{pointer-events:auto;border:0;margin:0;padding:0;background:transparent;box-shadow:none;transition:none;cursor:grab;touch-action:none;-webkit-tap-highlight-color:transparent;outline-offset:-4px}
.tm~[data-fizlet-slot]>.tm-play.tm-drag{cursor:grabbing}
.tm~[data-fizlet-slot] .tm-hud{position:absolute;inset:0;pointer-events:none;font:800 clamp(11px,1.6cqw,14px)/1.2 ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif;color:var(--ink)}
.tm-head{position:absolute;left:8px;top:8px;right:8px;display:grid;gap:6px}
.tm-top{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0}
.tm~[data-fizlet-slot] .tm-chip{display:inline-flex;align-items:center;gap:.45em;padding:.4em .7em;background:var(--surface);color:var(--ink);border:2px solid var(--rim);border-radius:8px;box-shadow:calc(3px * var(--bui-sx)) calc(3px * var(--bui-sy)) 0 var(--bui-shadow);white-space:nowrap}
.tm-chip span{font-variant-numeric:tabular-nums;margin-right:.35em}
.tm~[data-fizlet-slot] .tm-lvl{color:#1f2433;background:#ffd36b;rotate:-1.5deg}
.tm-hint{min-height:1.2em;padding:0 2px;margin:0;font-size:.92em;color:#f4efe4;text-shadow:0 1px 0 #10132a,0 0 4px #10132a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-theme="light"] .tm-hint{color:#1f2433;text-shadow:0 1px 0 #eee8e0,0 0 4px #eee8e0}
.tm-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0}
.tm~[data-fizlet-slot] .tm-card{position:absolute;left:50%;top:46%;translate:-50% -50%;rotate:-1.5deg;display:grid;justify-items:center;gap:.5em;width:min(84%,22em);padding:1em 1.2em 1.1em;background:var(--surface);color:var(--ink);border:2.5px solid var(--rim);border-radius:12px;box-shadow:calc(6px * var(--bui-sx)) calc(6px * var(--bui-sy)) 0 var(--bui-shadow);text-align:center;pointer-events:auto}
.tm~[data-fizlet-slot] .tm-card[hidden]{display:none}
.tm-card>b{font-size:1.9em}
.tm-card p{margin:0;color:var(--muted)}
.tm-card .tm-stats{color:var(--ink)}
.tm~[data-fizlet-slot] .tm-again{min-height:44px;padding:0 1.2em;font:inherit;background:var(--k-go);color:var(--rim)}
.bui 
.tm~[data-fizlet-slot] .gk[disabled]{opacity:.45}
.tm~[data-fizlet-slot] .gk b{font-weight:inherit}
@container stage (aspect-ratio<7/5){
.tm-head{right:56px}
.tm~[data-fizlet-slot] .tm-hud{font-size:clamp(11px,3.2cqw,14px)}
.tm-hint{white-space:normal}

}
[data-fizlet-slot]:focus-within .tm-play:focus-visible{outline:3px solid #ff8a6b}
</style></div>
