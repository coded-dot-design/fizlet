<div class="kj" aria-hidden="true"><style>
/* DOM Kaiju (site/gallery/pieces/kaiju/dom-kaiju.ts): the tabletop block, the sky behind it, the
   ape, the rivals, the helicopter, the tank and the little people draw on the scene's canvas; over it
   a transparent key takes the pointer (a tap punches) and the keyboard's focus. Board UI stickers: the
   ape's name, health and score and how much of the block is flat on top, a chip per rival (P2 when a
   second player has it) under them, a line of help, the calls in the middle, the 2P, ape and mute keys
   in the corner, the customiser (fur, trim, pattern, face, gear) and the score card. The touch controls are @fzlt/core/pad (a stick to walk and
   climb, PUNCH, JUMP and GRAB keys): on touch screens only when wide; square or tall, the block on
   top and the pad under it. Dark: a neon night. Light: a pastel day. */
.kj{position:absolute;inset:0;background:#0c0a1a}
html[data-theme="light"] .kj{background:#9c7a5c}
.kj-poster,.kj~[data-fizlet-slot]>canvas,.kj~[data-fizlet-slot]>.kj-play{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.kj-poster{object-fit:cover}
.kj~[data-fizlet-slot]>.kj-play{pointer-events:auto;border:0;margin:0;padding:0;background:transparent;box-shadow:none;transition:none;cursor:crosshair;touch-action:none;-webkit-tap-highlight-color:transparent;outline-offset:-4px}
.kj~[data-fizlet-slot] .kj-hud{position:absolute;inset:0;pointer-events:none;font:900 clamp(10px,1.7cqw,14px)/1.15 ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif;color:var(--ink)}
.kj-head{position:absolute;left:8px;top:8px;right:200px;display:grid;gap:6px}
.kj-rivals{display:flex;flex-wrap:wrap;gap:6px;margin:0}
.kj~[data-fizlet-slot] .kj-rival{gap:.35em;padding:.25em .55em;font-size:.86em;background:#3d3378;color:#e9e6ff}
.kj~[data-fizlet-slot] .kj-r1{background:#b23a9e}
.kj~[data-fizlet-slot] .kj-rival[hidden]{display:none}
.kj-rival em{font-style:normal;letter-spacing:.05em}
.kj-rival i{font-style:normal;padding:0 .3em;border-radius:4px;background:#ffd166;color:#0b0a14}
.kj-rival i:empty{display:none}
.kj-rival u{display:block;width:3.4em;height:.6em;border:2px solid #0b0a14;border-radius:3px;overflow:hidden;text-decoration:none;background:#0b0a1444}
.kj-rival s{display:block;height:100%;background:#7cf6ff;text-decoration:none}
.kj~[data-fizlet-slot] .kj-rival.kj-out{opacity:.55}
.kj~[data-fizlet-slot] .kj-rival.kj-p2{outline:3px solid #ffd166;outline-offset:1px}
.kj-top{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0}
.kj~[data-fizlet-slot] .kj-chip{display:inline-flex;align-items:center;gap:.4em;padding:.4em .7em;background:var(--surface);color:var(--ink);border:2px solid var(--rim);border-radius:8px;box-shadow:calc(3px * var(--bui-sx)) calc(3px * var(--bui-sy)) 0 var(--bui-shadow);white-space:nowrap;font-variant-numeric:tabular-nums}
.kj~[data-fizlet-slot] .kj-name{rotate:-1.5deg;background:#ff4fa8;color:#0b0a14;letter-spacing:.04em}
.kj~[data-fizlet-slot] .kj-hp em,.kj~[data-fizlet-slot] .kj-flat em{font-style:normal;font-size:.82em;letter-spacing:.06em}
.kj-hp u{display:block;width:6.5em;height:.75em;border:2px solid var(--rim);border-radius:4px;overflow:hidden;text-decoration:none}
.kj-hp s{display:block;height:100%;width:100%;background:#39ffb0;text-decoration:none;transition:width .15s}
html[data-theme="light"] .kj-hp s{background:#2fbf7f}
.kj~[data-fizlet-slot] .kj-hp.kj-low s{background:#ff4f5e}
.kj~[data-fizlet-slot] .kj-score{rotate:1deg}
.kj~[data-fizlet-slot] .kj-score span{min-width:3ch}
.kj~[data-fizlet-slot] .kj-flat{background:#ffd166;color:#0b0a14}
.kj-hint{min-height:1.2em;margin:0;padding:0 2px;font-size:.92em;color:#f4efff;text-shadow:0 1px 0 #0d0b1c,0 0 4px #0d0b1c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-theme="light"] .kj-hint{color:#1b1420;text-shadow:0 1px 0 #fff3dc,0 0 4px #fff3dc}
.kj~[data-fizlet-slot] .kj-toast{position:absolute;left:50%;top:30%;translate:-50% 0;rotate:-2deg;margin:0;padding:.45em .8em;max-width:calc(100% - 24px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--rim);color:#f6f3ff;border:2px solid var(--rim);border-radius:8px;box-shadow:calc(4px * var(--bui-sx)) calc(4px * var(--bui-sy)) 0 var(--bui-shadow);font-size:1.15em;letter-spacing:.03em}
.kj~[data-fizlet-slot] .kj-toast.kj-clean{background:#22e6ff;color:#0b0a14}
.kj~[data-fizlet-slot] .kj-toast.kj-go{background:var(--k-go);color:var(--rim)}
.kj~[data-fizlet-slot] .kj-toast.kj-meh{background:#ffd166;color:#0b0a14}
.kj~[data-fizlet-slot] .kj-toast.kj-bad{background:#ff4f5e;color:#0b0a14;rotate:2deg}
.kj~[data-fizlet-slot] .kj-toast[hidden],.kj~[data-fizlet-slot] .kj-card[hidden],.kj~[data-fizlet-slot] .kj-make[hidden]{display:none}
.kj-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0}
.kj-keys{position:absolute;right:8px;top:8px;display:flex;gap:6px;margin:0}
.kj~[data-fizlet-slot] .kj-key{min-width:44px;height:44px;padding:0 .7em;font:inherit;cursor:pointer;pointer-events:auto;background:var(--surface);color:var(--ink);border:2px solid var(--rim);border-radius:22px;box-shadow:calc(3px * var(--bui-sx)) calc(3px * var(--bui-sy)) 0 var(--bui-shadow)}
.kj~[data-fizlet-slot] .kj-card{position:absolute;left:50%;top:48%;translate:-50% -50%;rotate:-1.5deg;display:grid;justify-items:center;gap:.4em;width:min(86%,26em);padding:.9em 1.1em 1em;background:var(--surface);color:var(--ink);border:2.5px solid var(--rim);border-radius:12px;box-shadow:calc(6px * var(--bui-sx)) calc(6px * var(--bui-sy)) 0 var(--bui-shadow);text-align:center;pointer-events:auto}
.kj-card>b{font-size:1.9em;letter-spacing:.05em}
.kj-card p{margin:0}
.kj-card .kj-t{font-size:1.5em;font-variant-numeric:tabular-nums}
.kj-card .kj-stats{color:var(--muted);line-height:1.35}
.kj-board{display:grid;gap:4px;width:100%;margin:0;padding:0;list-style:none}
.kj-board li{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:0 .5em;padding:.25em .5em;border:2px solid var(--rim);border-radius:8px;text-align:left}
.kj-board li:first-child{background:#ffd166;color:#0b0a14}
.kj-board i{font-style:normal;font-size:.8em;padding:0 .35em;border:1.5px solid currentColor;border-radius:4px}
.kj-board span{font-variant-numeric:tabular-nums}
.kj-board em{grid-column:2 / 4;font-style:normal;font-size:.78em;opacity:.75}
.kj-again-row,.kj-go-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:0}
.kj~[data-fizlet-slot] .kj-again,.kj~[data-fizlet-slot] .kj-change,.kj~[data-fizlet-slot] .kj-go,.kj~[data-fizlet-slot] .kj-rand{min-height:44px;padding:0 1.2em;font:inherit;background:var(--k-go);color:var(--rim)}
.kj~[data-fizlet-slot] .kj-change,.kj~[data-fizlet-slot] .kj-rand{background:var(--surface);color:var(--ink)}
.kj~[data-fizlet-slot] .kj-make{position:absolute;right:10px;top:60px;bottom:10px;display:grid;align-content:center;gap:.5em;width:min(54%,31em);padding:.7em .8em .8em;background:var(--surface);color:var(--ink);border:2.5px solid var(--rim);border-radius:12px;box-shadow:calc(6px * var(--bui-sx)) calc(6px * var(--bui-sy)) 0 var(--bui-shadow);pointer-events:auto;overflow:auto}
.kj-mname{justify-self:center;font-size:1.45em;letter-spacing:.07em;rotate:-1.5deg;padding:.1em .5em;background:#ff4fa8;color:#0b0a14;border:2px solid var(--rim);border-radius:8px}
.kj-tabs{display:none;gap:4px;margin:0}
.kj~[data-fizlet-slot] .kj-tab{flex:1 1 0;min-width:44px;min-height:44px;padding:0 .2em;font:inherit;font-size:.82em;cursor:pointer;background:var(--surface);color:var(--muted);border:2px solid var(--rim);border-radius:9px}
.kj~[data-fizlet-slot] .kj-tab[aria-pressed="true"]{background:#ffd166;color:#0b0a14}
.kj-row{display:grid;grid-template-columns:4.6em 1fr;align-items:center;gap:.5em}
.kj-row>i{font-style:normal;font-size:.8em;letter-spacing:.07em;color:var(--muted)}
.kj-row>p{display:flex;flex-wrap:wrap;gap:5px;margin:0}
.kj~[data-fizlet-slot] .kj-opt{min-width:44px;min-height:44px;padding:0 .65em;font:inherit;font-size:.92em;cursor:pointer;background:var(--surface);color:var(--ink);border:2px solid var(--rim);border-radius:9px;box-shadow:calc(2px * var(--bui-sx)) calc(2px * var(--bui-sy)) 0 var(--bui-shadow)}
.kj~[data-fizlet-slot] .kj-opt[aria-pressed="true"]{background:#22e6ff;color:#0b0a14;translate:0 1px}
.kj~[data-fizlet-slot] .kj-sw{width:44px;padding:0;background:var(--c)}
.kj~[data-fizlet-slot] .kj-sw[aria-pressed="true"]{background:var(--c);outline:3px solid var(--ink);outline-offset:2px}
.kj~[data-fizlet-slot] .kj-opt:hover,.kj~[data-fizlet-slot] .kj-opt:focus-visible{outline:3px solid #ff4fa8;outline-offset:2px}
.kj~[data-fizlet-slot] .kj-pad{--u:.62px;display:none}
.kj~[data-fizlet-slot] .kj-pad .bui-pad-keys{max-width:none;flex-wrap:nowrap}
.kj~[data-fizlet-slot] .kj-pad svg{width:1.5em;height:1.5em;fill:currentColor;stroke:none}
@media (pointer:coarse){.kj~[data-fizlet-slot] .kj-pad{display:flex}}
@container stage (aspect-ratio<7/5){
.kj,.kj~[data-fizlet-slot]{--padh:clamp(104px,24cqh,128px)}
.kj-poster,.kj~[data-fizlet-slot]>canvas,.kj~[data-fizlet-slot]>.kj-play{height:calc(100cqh - var(--padh))}
.kj~[data-fizlet-slot] .kj-hud{font-size:clamp(11px,3.3cqw,14px)}
.kj-head{right:8px;top:60px}
.kj-hint{white-space:normal}
.kj~[data-fizlet-slot] .kj-pad{display:flex;--u:.72px;gap:calc(8 * var(--u));padding-inline:calc(8 * var(--u))}
.kj~[data-fizlet-slot] .kj-card{top:calc((100cqh - var(--padh)) / 2);font-size:.85em}
.kj~[data-fizlet-slot] .kj-toast{top:calc((100cqh - var(--padh)) * .42)}
.kj~[data-fizlet-slot] .kj-make{left:6px;right:6px;top:auto;bottom:6px;width:auto;gap:.3em;padding:.45em .5em .5em;font-size:.86em;z-index:2}
.kj-mname{font-size:1.2em}
.kj-tabs{display:flex}
.kj-row{display:none;grid-template-columns:1fr}
.kj-row>i{display:none}
.kj-make[data-tab="fur"] .kj-row[data-k="fur"],.kj-make[data-tab="trim"] .kj-row[data-k="trim"],.kj-make[data-tab="pattern"] .kj-row[data-k="pattern"],.kj-make[data-tab="face"] .kj-row[data-k="face"],.kj-make[data-tab="gear"] .kj-row[data-k="gear"]{display:grid}
.kj-row>p{justify-content:center}
.kj-row>p{gap:4px;flex-wrap:nowrap}
.kj-row[data-k="gear"]>p{flex-wrap:wrap}
.kj~[data-fizlet-slot] .kj-opt{padding:0 .4em;font-size:.86em}
.kj~[data-fizlet-slot] .kj-sw{width:44px;flex:0 0 44px}
}
[data-fizlet-slot]:focus-within .kj-play:focus-visible{outline:3px solid #22e6ff}
