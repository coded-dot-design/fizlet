<div class="sb" aria-hidden="true"><style>
/* Salvo Bay (site/gallery/pieces/salvo/salvo-bay.ts): the diorama draws on the scene's canvas (the whole
   stage); over it, a transparent key takes the pointer and the keyboard's focus, Board UI stickers
   show the turn and the fleets, a line of help sits under them and the end card comes up in the
   middle. The keys (mute, rotate, random, start, view) are the gallery's keys strip
   (site/gallery/pieces/keys.ts), and the camera frames the bays between the stickers and the strip.
   Wide: both bays side by side. Square or tall (a phone held upright): one bay at a time, the camera
   following the turn. Dark: the bay at night under the lighthouse. Light: a bright afternoon. */
.sb{position:absolute;inset:0;background:#141a2c}
html[data-theme="light"] .sb{background:#efe8de}
.sb-poster,.sb~[data-fizlet-slot]>canvas,.sb~[data-fizlet-slot]>.sb-play{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.sb-poster{object-fit:cover}
.sb~[data-fizlet-slot]>.sb-play{pointer-events:auto;border:0;margin:0;padding:0;background:transparent;box-shadow:none;transition:none;cursor:grab;touch-action:pan-y;-webkit-tap-highlight-color:transparent;outline-offset:-4px}
.sb~[data-fizlet-slot]>.sb-play.sb-aim{cursor:crosshair}
.sb~[data-fizlet-slot]>.sb-play.sb-drag{cursor:grabbing}
.sb~[data-fizlet-slot] .sb-hud{position:absolute;inset:0;pointer-events:none;font:800 clamp(11px,1.6cqw,14px)/1.2 ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif;color:var(--ink)}
.sb-head{position:absolute;left:8px;top:8px;right:8px;display:grid;gap:6px}
.sb-top{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0}
.sb~[data-fizlet-slot] .sb-chip{display:inline-flex;align-items:center;gap:.45em;padding:.4em .7em;background:var(--surface);color:var(--ink);border:2px solid var(--rim);border-radius:8px;box-shadow:calc(3px * var(--bui-sx)) calc(3px * var(--bui-sy)) 0 var(--bui-shadow);white-space:nowrap}
.sb-chip span{font-variant-numeric:tabular-nums;margin-right:.35em}
.sb-dot{display:inline-block;width:.7em;height:.7em;border:2px solid var(--rim);border-radius:50%;background:#f08e6f}
.sb-dot.sb-foe{background:#8f9dc6}
.sb~[data-fizlet-slot] .sb-turn{color:#1f2433;rotate:-1.5deg}
.sb~[data-fizlet-slot] .sb-place{background:#7fcfa8}
.sb~[data-fizlet-slot] .sb-you{background:#f08e6f}
.sb~[data-fizlet-slot] .sb-them{background:#8f9dc6}
.sb-hint{min-height:1.2em;padding:0 2px;margin:0;font-size:.92em;color:#f4efe4;text-shadow:0 1px 0 #141a2c,0 0 4px #141a2c;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-theme="light"] .sb-hint{color:#1f2433;text-shadow:0 1px 0 #efe8de,0 0 4px #efe8de}
.sb-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0}
.sb~[data-fizlet-slot] .sb-card{position:absolute;left:50%;top:46%;translate:-50% -50%;rotate:-1.5deg;display:grid;justify-items:center;gap:.5em;width:min(84%,22em);padding:1em 1.2em 1.1em;background:var(--surface);color:var(--ink);border:2.5px solid var(--rim);border-radius:12px;box-shadow:calc(6px * var(--bui-sx)) calc(6px * var(--bui-sy)) 0 var(--bui-shadow);text-align:center;pointer-events:auto}
.sb~[data-fizlet-slot] .sb-card[hidden]{display:none}
.sb-card>b{font-size:1.9em}
.sb-card p{margin:0;color:var(--muted)}
.sb-card .sb-stats{color:var(--ink)}
.sb~[data-fizlet-slot] .sb-again{min-height:44px;padding:0 1.2em;font:inherit;background:var(--k-go);color:var(--rim)}
.bui .sb~[data-fizlet-slot] .gk.sb-go:not([disabled]){background:var(--k-go);color:var(--rim)}
.sb~[data-fizlet-slot] .gk[disabled]{opacity:.45}
.sb~[data-fizlet-slot] .gk b{font-weight:inherit}
@container stage (aspect-ratio<7/5){
.sb-head{right:56px}
.sb~[data-fizlet-slot] .sb-hud{font-size:clamp(11px,3.2cqw,14px)}
.sb-hint{white-space:normal}
.sb-vl{display:none}
}
[data-fizlet-slot]:focus-within .sb-play:focus-visible{outline:3px solid #f08e6f}
</style></div>
