<div class="ss" data-ss aria-hidden="true"><style>
/* Two-Minute Sesh (site/gallery/pieces/skate/two-minute-sesh.ts): the park, the rider and the callouts draw
   on the scene's canvas (the art's 16:9 box); the HUD is Board UI stickers over it (score, clock,
   letters, special, the combo line, the score card) and the touch keys are @fzlt/core/pad.
   Wide: the art fills the stage, the stickers sit on its sky; the pad shows on touch screens only
   (the keyboard plays it otherwise). Square or tall (a phone held upright): the art fills all but
   the pad's band at the bottom, the scene follows the rider (bigger), the stickers sit on its sky. Dark: the park after dark under two floodlights.
   Light: a bright afternoon. Colours: Board UI token roles, plus plywood. */
.ss{position:absolute;inset:0;--ss-sky:#0c0a1c;--ss-sky2:#2a1c4a;--ss-wall:#1d1738;--ss-wood:#c8894a;--ss-wood2:#9a5f34;--ss-floor:#3b3170;--ss-ink:#07060f;--ss-paper:#f6f3ff;--ss-metal:#aea4d6;--ss-hood:#ff2e88;--ss-cap:#19f0ff;--ss-skin:#ffd2a8;--ss-pants:#9a63ff;--ss-deck:#39ffb0;--ss-gold:#ffc21a;--ss-go:#39ffb0;--ss-hot:#ff8a1f;--ss-shade:rgba(7,6,15,.45);background:#0c0a1c}
html[data-theme="light"] .ss{--ss-sky:#9fe8ff;--ss-sky2:#f6f3ff;--ss-wall:#e6e4f8;--ss-wood:#e0a066;--ss-wood2:#b5703d;--ss-floor:#b9b2e3;--ss-metal:#5d5684;--ss-shade:rgba(27,22,54,.28);background:#9fe8ff}
.ss-poster,.ss~[data-fizlet-slot]>canvas,.ss~[data-fizlet-slot]>.ss-play{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.ss~[data-fizlet-slot]>.ss-play{pointer-events:auto;border:0;margin:0;padding:0;background:transparent;box-shadow:none;transition:none;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;outline-offset:-4px}
.ss~[data-fizlet-slot] .ss-hud{position:absolute;inset:0;pointer-events:none;font:900 clamp(10px,1.9cqw,15px)/1 ui-monospace,monospace;color:var(--ink)}
.ss~[data-fizlet-slot] .ss-chip{position:absolute;display:flex;align-items:center;gap:.45em;margin:0;padding:.45em .7em;background:var(--surface);color:var(--ink);border:2px solid var(--rim);border-radius:8px;box-shadow:calc(3px * var(--bui-sx)) calc(3px * var(--bui-sy)) 0 var(--bui-shadow);white-space:nowrap}
.ss~[data-fizlet-slot] .ss-chip small{font-size:.62em;letter-spacing:.14em;color:var(--muted)}
.ss-score{left:8px;top:8px;rotate:-2deg}
.ss-score span{font-size:1.3em;color:var(--k-sys-ink)}
.ss-clock{left:50%;top:8px;translate:-50% 0;font-size:1.3em}
.ss-clock.ss-hot{background:var(--k-fire);color:#f6f3ff}
.ss-let{right:60px;top:8px;rotate:2deg;gap:.15em!important}
.ss-let i{font-style:normal;width:1.15em;text-align:center;color:var(--muted);opacity:.6}
.ss-let i.on{color:var(--rim);background:var(--hurt);border-radius:4px;opacity:1}
.ss~[data-fizlet-slot] .ss-mute{right:6px;top:4px;width:44px;height:44px;justify-content:center;padding:0;font-size:16px;cursor:pointer;pointer-events:auto;border-radius:22px}
.ss-spec{left:8px;top:calc(8px + 2.9em);rotate:-1deg}
.ss-spec>i{position:relative;display:block;width:5em;height:.7em;border:2px solid var(--rim);border-radius:4px;background:var(--bg);overflow:hidden}
.ss-spec>i>i{position:absolute;inset:0;background:var(--k-cmd);transform-origin:left;transform:scaleX(0)}
.ss-spec.ss-full{background:var(--hurt);color:var(--rim)}
.ss-spec.ss-full small{color:var(--rim)}
.ss-spec.ss-full>i>i{background:var(--k-go)}
.ss~[data-fizlet-slot] .ss-combo{position:absolute;left:50%;top:calc(8px + 2.6em);translate:-50% 0;max-width:calc(100% - 24px);margin:0;padding:.4em .7em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--rim);color:#f6f3ff;border-radius:6px;font-size:.92em;rotate:-1deg}
.ss-combo b{color:var(--hurt)}
.ss-combo em{font-style:normal;color:var(--k-go)}
.ss~[data-fizlet-slot] .ss-combo.ss-bank{background:var(--k-go);color:var(--rim)}
.ss-combo.ss-bank em{color:var(--rim)}
.ss~[data-fizlet-slot] .ss-combo.ss-bail{background:var(--k-fire)}
.ss~[data-fizlet-slot] .ss-combo[hidden],.ss~[data-fizlet-slot] .ss-card[hidden]{display:none}
.ss~[data-fizlet-slot] .ss-card{position:absolute;left:50%;top:50%;translate:-50% -46%;rotate:-2deg;display:grid;justify-items:center;gap:.35em;width:min(84%,26em);padding:.9em 1em 1em;background:var(--k-flag);color:var(--rim);border:2.5px solid var(--rim);border-radius:10px;box-shadow:calc(5px * var(--bui-sx)) calc(5px * var(--bui-sy)) 0 var(--bui-shadow);text-align:center}
.ss-card small{letter-spacing:.3em;font-size:.75em}
.ss-card>b{font-size:2.4em;letter-spacing:.04em}
.ss-card p{margin:0;font-size:.85em;letter-spacing:.06em}
.ss-card strong{color:#006e91}
.ss-card .ss-best{font-size:.75em;color:#5d5684;white-space:normal;line-height:1.3}
.ss-card .ss-again{margin-top:.3em;padding:.35em .8em;background:var(--k-go);border:2px solid var(--rim);border-radius:6px}
/* The pad: touch screens only on a wide stage; on a square or tall one it sits under the art. */
.ss~[data-fizlet-slot] .ss-pad{--u:.62px;display:none}
.ss~[data-fizlet-slot] .ss-pad .bui-pad-keys{max-width:none;flex-wrap:nowrap}
@media (pointer:coarse){.ss~[data-fizlet-slot] .ss-pad{display:flex}}
@container stage (aspect-ratio<7/5){
.ss,.ss~[data-fizlet-slot]{--padh:clamp(112px,25cqh,140px)}
.ss-poster,.ss~[data-fizlet-slot]>canvas,.ss~[data-fizlet-slot]>.ss-play{height:calc(100cqh - var(--padh))}
.ss-poster{object-fit:cover;object-position:0 100%}
.ss{box-shadow:inset 0 calc(-1 * var(--padh)) var(--ss-floor)}
.ss~[data-fizlet-slot] .ss-hud{font-size:clamp(11px,3.4cqw,15px)}
.ss-let{top:calc(8px + 2.9em);right:8px}
.ss~[data-fizlet-slot] .ss-pad{display:flex;--u:clamp(.72px,calc(var(--padh) / 150),.85px)}
.ss~[data-fizlet-slot] .ss-combo{top:calc(8px + 5.6em)}
.ss~[data-fizlet-slot] .ss-card{top:calc((100cqh - var(--padh)) / 2)}
}
[data-fizlet-slot]:focus-within .ss-play:focus-visible{outline:3px solid #19f0ff}
</style></div>
