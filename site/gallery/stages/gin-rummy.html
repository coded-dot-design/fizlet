<div class="ct" aria-hidden="true"><style>
/* Gin Rummy (site/gallery/pieces/gin/gin-rummy.ts), the card table series: the diorama draws on
   the scene's canvas (the whole stage); over it, a transparent key takes the pointer (tap the stock,
   the discard or a card) and the keyboard's focus, Board UI stickers show whose turn it is, the
   scores and your deadwood, a line of help sits under them and the game-over card comes up in the
   middle. The keys (mute; stock, take; discard, knock; next hand) are the gallery's keys strip
   (site/gallery/pieces/keys.ts). The same sheet as the series' other tables (Blackjack, Solitaire,
   Hold'em). Dark: a lamp-lit night. Light: a bright afternoon.
 */
.ct{position:absolute;inset:0;background:#120f1f}
html[data-theme="light"] .ct{background:#f1e9df}
.ct-poster,.ct~[data-fizlet-slot]>canvas,.ct~[data-fizlet-slot]>.ct-play{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none}
.ct-poster{object-fit:cover}
.ct~[data-fizlet-slot]>.ct-play{pointer-events:auto;border:0;margin:0;padding:0;background:transparent;box-shadow:none;transition:none;cursor:pointer;touch-action:none;-webkit-tap-highlight-color:transparent;outline-offset:-4px}
.ct~[data-fizlet-slot] .ct-hud{position:absolute;inset:0;pointer-events:none;font:800 clamp(11px,1.6cqw,14px)/1.2 ui-rounded,"SF Pro Rounded",Nunito,system-ui,sans-serif;color:var(--ink)}
.ct-head{position:absolute;left:8px;top:8px;right:8px;display:grid;gap:6px}
.ct-top{display:flex;flex-wrap:wrap;gap:6px 8px;margin:0}
.ct~[data-fizlet-slot] .ct-chip{display:inline-flex;align-items:center;gap:.45em;padding:.4em .7em;background:var(--surface);color:var(--ink);border:2px solid var(--rim);border-radius:8px;box-shadow:calc(3px * var(--bui-sx)) calc(3px * var(--bui-sy)) 0 var(--bui-shadow);white-space:nowrap}
.ct-chip span{font-variant-numeric:tabular-nums}
.ct~[data-fizlet-slot] .ct-turn{background:#ffd36b;color:#1f2433;rotate:-1.5deg}
.ct-hint{min-height:1.2em;padding:0 2px;margin:0;font-size:.92em;color:#f4efe4;text-shadow:0 1px 0 #120f1f,0 0 4px #120f1f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
html[data-theme="light"] .ct-hint{color:#1f2433;text-shadow:0 1px 0 #f1e9df,0 0 4px #f1e9df}
.ct-live{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);margin:0}
.ct~[data-fizlet-slot] .ct-card{position:absolute;left:50%;top:46%;translate:-50% -50%;rotate:-1.5deg;display:grid;justify-items:center;gap:.5em;width:min(84%,21em);padding:1em 1.2em 1.1em;background:var(--surface);color:var(--ink);border:2.5px solid var(--rim);border-radius:12px;box-shadow:calc(6px * var(--bui-sx)) calc(6px * var(--bui-sy)) 0 var(--bui-shadow);text-align:center;pointer-events:auto}
.ct~[data-fizlet-slot] .ct-card[hidden]{display:none}
.ct-card>b{font-size:1.9em}
.ct-card p{margin:0;color:var(--muted)}
.ct~[data-fizlet-slot] .ct-again{min-height:44px;padding:0 1.2em;font:inherit;background:var(--k-go);color:var(--rim)}
.ct~[data-fizlet-slot] .gk.ct-go:not(:disabled){background:var(--k-go);color:var(--rim)}
.ct~[data-fizlet-slot] .gk:disabled{opacity:.4;cursor:default}
@container stage (aspect-ratio<7/5){
.ct-head{right:56px}
.ct~[data-fizlet-slot] .ct-hud{font-size:clamp(11px,3.2cqw,14px)}
.ct-hint{white-space:normal}
}
[data-fizlet-slot]:focus-within .ct-play:focus-visible{outline:3px solid #f07f68}
</style></div>
