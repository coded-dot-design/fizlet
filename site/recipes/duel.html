<div id="duel" style="display: grid; gap: 10px">
  <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px">
    <canvas width="320" height="120" style="width: 100%; touch-action: none; background: #07060f; border-radius: 10px" aria-label="Player 1's screen"></canvas>
    <canvas width="320" height="120" style="width: 100%; touch-action: none; background: #07060f; border-radius: 10px" aria-label="Player 2's screen"></canvas>
  </div>
  <p style="margin: 0">Frame <b data-frame>0</b> · <b data-sync>in sync</b> · P1: A/D or hold the left screen's sides · P2: J/L or the right screen's</p>
</div>
