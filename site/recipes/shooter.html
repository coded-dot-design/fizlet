<div id="shooter" style="display: grid; gap: 10px">
  <canvas width="480" height="320" aria-label="The shooter: bugs fall, your ship fires up" style="width: 100%; max-width: 560px; touch-action: none; background: #07060f; border-radius: 10px"></canvas>
  <p style="display: flex; gap: 14px; align-items: center; margin: 0">
    <button type="button" class="bui-key bui-arcade bui-go">Start</button>
    <span>Score <b data-score>0</b></span><span>Lives <b data-lives>3</b></span>
    <small>A/D or ←/→ move · Space fires · or drag and tap</small>
  </p>
</div>
