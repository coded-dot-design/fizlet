name: Fizlet checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Typecheck, kernel contract tests (incl. zero allocation), build.
      - run: npm run check
      # Size budgets: kernel <= 4 KB gzip, each brick ~1.5 KB.
      - run: npm run size
      # The runtime has no dependencies, ever.
      - run: node -e "const p=require('./package.json'); if (Object.keys(p.dependencies||{}).length || Object.keys(p.peerDependencies||{}).length) { console.error('Fizlet ships no runtime dependencies'); process.exit(1) }"
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
  tag-version:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          tag="v$(node -p 'require("./package.json").version')"
          git fetch origin --tags
          if git show-ref --verify --quiet "refs/tags/$tag"; then exit 0; fi
          git tag "$tag"
          git push origin "$tag"
