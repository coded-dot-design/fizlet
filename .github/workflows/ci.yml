name: Fizlet checks
# Push runs on main only (tag-version and release need them); a branch is checked by its PR run.
# Before: a branch with a PR ran twice per push (35 of 90 runs on 2026-10-30, 159 of 401 wall
# minutes). The Fizlet factory's CI uses the same triggers.
on:
  push:
    branches: [main]
  pull_request:
  # The perf job once a week (Mondays 06:17 UTC), so a slow drift shows up without a PR.
  schedule:
    - cron: "17 6 * * 1"
permissions:
  contents: read
jobs:
  # The suite runs as parallel jobs; `check` at the end is the one required result (tag-version needs
  # it, release.yml reads it by that name). The website and its checks moved to their own repository.
  unit:
    # Typecheck, kernel contract tests (incl. zero allocation), build, API snapshots, sizes and the
    # package: everything that is not a Chromium suite.
    # The weekly schedule runs only the perf job.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # HEAD^ is the base for api:check: on a PR, HEAD is the merge commit and HEAD^ the base
          # branch's tip; on a push to main, the commit before it.
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          browser: "true"
      # Failures are echoed as annotations so they can be read through the API (job logs are not
      # always reachable).
      - name: npm run check
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee /tmp/step.log || { grep -E "✖|not ok|Error|error TS|AssertionError|expected|actual|OVER|failed" /tmp/step.log | head -40 | sed 's/^/::error::/'; exit 1; }
      # COMPLETE bricks keep their API: the snapshots in api/ match the build, and one that changed
      # since the base names its brick under "## Unreleased" in CHANGELOG.md.
      - run: npm run api:check -- --base HEAD^
      # Every public export, option and return member has TSDoc: one without it that is not in the
      # baseline (scripts/docs-coverage.json, which only shrinks) fails here. dist/ is built by check.
      - run: npm run docs:coverage -- --no-build --check
      # Size budgets: kernel <= 4 KB gzip, each brick ~1.5 KB.
      - run: npm run size
      # The runtime has no dependencies, ever.
      - run: node -e "const p=require('./package.json'); if (Object.keys(p.dependencies||{}).length || Object.keys(p.peerDependencies||{}).length) { console.error('Fizlet ships no runtime dependencies'); process.exit(1) }"
      # The npm package: pack, install the tarball, import and typecheck every subpath.
      - run: npm run test:pack
      # What npm would ship: only dist/, bin/ and the docs; no comments in shipped code, no agent words.
      - run: npm run publish-clean
  browser:
    # npm run test:browser in 2 shards: scripts/shard.mjs takes package.json's list (the one source)
    # and balances it by tests/shard-times.json; each shard runs every file and fails on any red one.
    # The weekly schedule runs only the perf job.
    if: github.event_name != 'schedule'
    name: browser (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browser: "true"
      - run: node scripts/shard.mjs test:browser ${{ matrix.shard }}/2
  webkit:
    # Touch and pointer in WebKit as well as Chromium (npm run test:webkit; BROWSERS=chromium,webkit):
    # input's pointer and stick, pad's controls, the touch lock, with the shapes iOS ends a touch in
    # (only lostpointercapture, or nothing). Chromium's CDP touch is not WebKit's, so a control can
    # pass every Chromium test and still fail on iPhone Safari. Playwright's Linux WebKit is WebKit,
    # not iOS: it catches engine differences, not iOS's touch delivery (real devices stay manual).
    # ubuntu-24.04: Playwright 1.58 has no WebKit build for ubuntu-latest (26.04).
    # The weekly schedule runs only the perf job.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browser: "true"
      - run: npx playwright install --with-deps webkit
      - run: npm run test:webkit
  check:
    # The required check: green only when every job above is green. `always()` so a failed or
    # cancelled job makes this red instead of skipped (a skipped required check would count as passed).
    needs: [unit, browser, webkit]
    if: always() && github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "unit browser webkit: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "::error::a check job did not pass ($RESULTS)"; exit 1; }; done
  perf:
    # Measured, not claimed: frame times, dropped frames, first paint, heap and minor GCs under a
    # 4x CPU throttle, failing over tests/perf/budgets.json; plus the game-level allocation test.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browser: "true"
      # One command: builds the perf fixture (tests/perf/fixture: the home demo on a page of its
      # own), measures, runs the allocation test, writes perf-results.json.
      - run: npm run perf
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          # Kept 90 days, so twelve weekly runs can be compared.
          name: perf-results
          path: perf-results.json
          if-no-files-found: ignore
          retention-days: 90
  tag-version:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          git fetch origin --tags
          if git show-ref --verify --quiet "refs/tags/$tag"; then exit 0; fi
          git tag "$tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  # A new tag publishes to npm (a tag pushed with GITHUB_TOKEN starts no workflow by itself).
  release:
    needs: tag-version
    if: needs.tag-version.outputs.tag != ''
    permissions:
      contents: read
      id-token: write
      # release.yml reads this commit's `check` result to skip re-running the browser suite.
      actions: read
      checks: read
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag-version.outputs.tag }}
    secrets: inherit
