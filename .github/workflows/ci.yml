name: Fizlet checks
# Push runs on main only (tag-version and release need them); a branch is checked by its PR run.
# Before: a branch with a PR ran twice per push (35 of 90 runs on 2026-10-30, 159 of 401 wall
# minutes). The Fizlet factory's CI uses the same triggers.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  # The suite runs as parallel jobs; `check` at the end is the one required result (tag-version needs
  # it, release.yml reads it by that name). Before the split one `check` job ran everything in a row:
  # 42 min on main at 0.21.3 (test:browser 23.5, test:site 11.8, test:settle 3.5) of a 75-min timeout.
  unit:
    # Typecheck, kernel contract tests (incl. zero allocation), build, API snapshots, sizes, the
    # package and the layers story: everything that is not a long Chromium suite.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # HEAD^ is the base for api:check: on a PR, HEAD is the merge commit and HEAD^ the base
          # branch's tip; on a push to main, the commit before it.
          fetch-depth: 2
      - uses: ./.github/actions/setup
        with:
          browser: "true"
      # Failures are echoed as annotations so they can be read through the API (job logs are not
      # always reachable).
      - name: npm run check
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee /tmp/step.log || { grep -E "✖|not ok|Error|error TS|AssertionError|expected|actual|OVER|failed" /tmp/step.log | head -40 | sed 's/^/::error::/'; exit 1; }
      # COMPLETE bricks keep their API: the snapshots in api/ match the build, and one that changed
      # since the base names its brick under "## Unreleased" in CHANGELOG.md.
      - run: npm run api:check -- --base HEAD^
      # Size budgets: kernel <= 4 KB gzip, each brick ~1.5 KB.
      - run: npm run size
      # The runtime has no dependencies, ever.
      - run: node -e "const p=require('./package.json'); if (Object.keys(p.dependencies||{}).length || Object.keys(p.peerDependencies||{}).length) { console.error('Fizlet ships no runtime dependencies'); process.exit(1) }"
      # The layers story (site/demos/layers): mounts, cycles once, settles, Recall is exact.
      - run: npm run test:layers
      # The npm package: pack, install the tarball, import and typecheck every subpath.
      - run: npm run test:pack
  browser:
    # npm run test:browser in 4 shards: scripts/shard.mjs takes package.json's list (the one source)
    # and balances it by tests/shard-times.json; each shard runs every file and fails on any red one.
    name: browser (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browser: "true"
      - run: node scripts/shard.mjs test:browser ${{ matrix.shard }}/4
  site:
    # The website builds and passes its checks (deployed by pages.yml): npm run test:site in 2 shards
    # (tests/site.mjs alone is ~6 min, the rest together about the same).
    name: site (${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browser: "true"
      - run: npm run site
      - run: node scripts/shard.mjs test:site ${{ matrix.shard }}/2
  settle:
    # Every gallery entry plays its autoplay story through before it settles (on the built site).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browser: "true"
      - run: npm run site
      - name: npm run test:settle
        shell: bash
        run: |
          set -o pipefail
          npm run test:settle 2>&1 | tee /tmp/step.log || { grep -E "✖|not ok|Error|error TS|AssertionError|expected|actual|OVER|failed|quiet for" /tmp/step.log | head -40 | sed 's/^/::error::/'; exit 1; }
  check:
    # The required check: green only when every job above is green. `always()` so a failed or
    # cancelled job makes this red instead of skipped (a skipped required check would count as passed).
    needs: [unit, browser, site, settle]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "unit browser site settle: $RESULTS"
          for r in $RESULTS; do [ "$r" = success ] || { echo "::error::a check job did not pass ($RESULTS)"; exit 1; }; done
  perf:
    # Measured, not claimed: frame times, dropped frames, first paint, heap and minor GCs under a
    # 4x CPU throttle, failing over tests/perf/budgets.json; plus the game-level allocation test.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          browser: "true"
      # One command: builds the site, measures, runs the allocation test, writes perf-results.json.
      - run: npm run perf
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: perf-results.json
          if-no-files-found: ignore
  tag-version:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          git fetch origin --tags
          if git show-ref --verify --quiet "refs/tags/$tag"; then exit 0; fi
          git tag "$tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  # A new tag publishes to npm (a tag pushed with GITHUB_TOKEN starts no workflow by itself).
  release:
    needs: tag-version
    if: needs.tag-version.outputs.tag != ''
    permissions:
      contents: read
      id-token: write
      # release.yml reads this commit's `check` result to skip re-running the browser suite.
      actions: read
      checks: read
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag-version.outputs.tag }}
    secrets: inherit
