name: Fizlet checks
# Push runs on main only (tag-version and release need them); a branch is checked by its PR run.
# Before: a branch with a PR ran twice per push (35 of 90 runs on 2026-10-30, 159 of 401 wall
# minutes). fizlet-engine's CI uses the same triggers.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          # HEAD^ is the base for api:check: on a PR, HEAD is the merge commit and HEAD^ the base
          # branch's tip; on a push to main, the commit before it.
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Typecheck, kernel contract tests (incl. zero allocation), build. Failures are echoed as
      # annotations so they can be read through the API (job logs are not always reachable).
      - name: npm run check
        shell: bash
        run: |
          set -o pipefail
          npm run check 2>&1 | tee /tmp/step.log || { grep -E "✖|not ok|Error|error TS|AssertionError|expected|actual|OVER|failed" /tmp/step.log | head -40 | sed 's/^/::error::/'; exit 1; }
      # COMPLETE bricks keep their API: the snapshots in api/ match the build, and one that changed
      # since the base names its brick under "## Unreleased" in CHANGELOG.md.
      - run: npm run api:check -- --base HEAD^
      # Size budgets: kernel <= 4 KB gzip, each brick ~1.5 KB.
      - run: npm run size
      # fizlet-rooms (the room server prototype): caps, relay, the Worker and Room on fakes. No
      # install: its Node tests need no packages (wrangler is only for test:wrangler and deploys).
      - run: npm test
        working-directory: rooms
      # The runtime has no dependencies, ever.
      - run: node -e "const p=require('./package.json'); if (Object.keys(p.dependencies||{}).length || Object.keys(p.peerDependencies||{}).length) { console.error('Fizlet ships no runtime dependencies'); process.exit(1) }"
      - run: npx playwright install --with-deps chromium
      - name: npm run test:browser
        shell: bash
        run: |
          set -o pipefail
          npm run test:browser 2>&1 | tee /tmp/step.log || { grep -E "✖|not ok|Error|error TS|AssertionError|expected|actual|OVER|failed" /tmp/step.log | head -40 | sed 's/^/::error::/'; exit 1; }
      # The layers story (site/demos/layers): mounts, cycles once, settles, Recall is exact.
      - run: npm run test:layers
      # The npm package: pack, install the tarball, import and typecheck every subpath.
      - run: npm run test:pack
      # The website builds and passes its checks (deployed by pages.yml).
      - run: npm run site
      - name: npm run test:site
        shell: bash
        run: |
          set -o pipefail
          npm run test:site 2>&1 | tee /tmp/step.log || { grep -E "✖|not ok|Error|error TS|AssertionError|expected|actual|OVER|failed" /tmp/step.log | head -40 | sed 's/^/::error::/'; exit 1; }
      # Every gallery entry plays its autoplay story through before it settles (on the built site).
      - name: npm run test:settle
        shell: bash
        run: |
          set -o pipefail
          npm run test:settle 2>&1 | tee /tmp/step.log || { grep -E "✖|not ok|Error|error TS|AssertionError|expected|actual|OVER|failed|quiet for" /tmp/step.log | head -40 | sed 's/^/::error::/'; exit 1; }
  perf:
    # Measured, not claimed: frame times, dropped frames, first paint, heap and minor GCs under a
    # 4x CPU throttle, failing over tests/perf/budgets.json; plus the game-level allocation test.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # One command: builds the site, measures, runs the allocation test, writes perf-results.json.
      - run: npm run perf
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: perf-results.json
          if-no-files-found: ignore
  tag-version:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          git fetch origin --tags
          if git show-ref --verify --quiet "refs/tags/$tag"; then exit 0; fi
          git tag "$tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
  # A new tag publishes to npm (a tag pushed with GITHUB_TOKEN starts no workflow by itself).
  release:
    needs: tag-version
    if: needs.tag-version.outputs.tag != ''
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag-version.outputs.tag }}
    secrets: inherit
