name: Fizlet site
# Builds the website (site/ → site-dist/) and deploys it to GitHub Pages:
# https://coded-dot-design.github.io/fizlet/
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # dist/ (hosted for the quick start) + site-dist/
      - run: npm run site
      - run: npx playwright install --with-deps chromium
      # Every page at desktop and 360px: no errors, links resolve, no overflow, the demo runs.
      - run: npm run test:site
      # The deployed build: GA4 + PostHog behind the consent banner (site/analytics) when the public ids
      # are set as repository Variables (not Secrets); unset = off, no analytics code. The tests above
      # ran on the id-less build (no banner in their way); this checks the runtime is on every page once.
      - name: Build with analytics ids
        if: ${{ vars.PUBLIC_GA4_ID != '' || vars.PUBLIC_POSTHOG_KEY != '' }}
        run: npm run site && node tests/site-analytics.mjs
        env:
          PUBLIC_GA4_ID: ${{ vars.PUBLIC_GA4_ID }}
          PUBLIC_POSTHOG_KEY: ${{ vars.PUBLIC_POSTHOG_KEY }}
          PUBLIC_POSTHOG_HOST: ${{ vars.PUBLIC_POSTHOG_HOST }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
