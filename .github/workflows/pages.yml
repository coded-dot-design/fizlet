name: Fizlet site
# Builds the website (site/ → site-dist/) and deploys it to GitHub Pages:
# https://coded-dot-design.github.io/fizlet/
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      # dist/ (hosted for the quick start) + site-dist/
      - run: npm run site
      - run: npx playwright install --with-deps chromium
      # Every page at desktop and 360px: no errors, links resolve, no overflow, the demo runs.
      - run: npm run test:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site-dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
