# fizlet-rooms. Local: `npm run dev` (wrangler dev --local). Deploy: see DEPLOY.md (owner step, not CI).
# No secrets live here: the deploy token is an environment secret, the KV id is not a secret.
name = "fizlet-rooms"
main = "src/worker.js"
compatibility_date = "2025-09-01"
# Workers Logs on, but no invocation logs: those record every request URL, and clients older than
# this release still put the invite code in the URL (`?invite=` / `?code=`). The worker logs nothing
# itself. See THREAT-MODEL.md.
[observability]
enabled = true

[observability.logs]
invocation_logs = false

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Play passes (src/pass.js): one object holds the device locks and the revoked list. Used only
# when REQUIRE_PASS is "true".
[[durable_objects.bindings]]
name = "PASSES"
class_name = "Passes"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Passes"]

# Invite codes for the demo gate: key = "invite:" + SHA-256(code), value = a label. See DEPLOY.md.
# `id` is filled in at deploy time from `wrangler kv namespace create INVITES` (local dev ignores it).
[[kv_namespaces]]
binding = "INVITES"
id = "9c046da273114c86a560cf1fe67fef77"

# Spend caps (src/limits.js clamps each to a hard ceiling; these can only lower them).
[vars]
MAX_ROOMS = "16"
MAX_PLAYERS = "4"
MSG_RATE = "90"
MSG_BURST = "180"
IDLE_SECONDS = "120"
MAX_ROOM_SECONDS = "1800"
LOBBY_SECONDS = "90"
GATE_RATE = "30"
JOIN_RATE = "10"
RESUME_SECONDS = "20"
# Comma-separated page origins allowed to connect (the deployed demo: the Blitz site). Empty = any;
# `npm run dev` and test:wrangler clear it locally.
ALLOWED_ORIGINS = "https://battlefieldblitz.domvirus.com"
# Play passes: "true" makes every join show a valid pass (and its device key) instead of an invite
# code. Off by default. Before switching it on, set the Worker secrets PASS_SECRET (and
# ROOMS_ADMIN_KEY for revoking): `wrangler secret put PASS_SECRET`. See README "Play passes".
REQUIRE_PASS = "false"
